function mkSup(n,ph,ad){n=n.trim().replace(/\s+/g,' ');if(!n){alert('Enter supplier name');return null}const s=SP().find(x=>nz(x.n)==nz(n));if(s){alert('Supplier already exists: '+s.n);return s}const o={id:nsid(),n,ph:ph.trim(),ad:ad.trim()};SP().push(o);save();ntf(n+' added to suppliers','','New supplier');return o}
function saveNS(){const o=mkSup($('#xnn1').value,$('#xnp1').value,$('#xna1').value);if(o){$('#xus').innerHTML=sopt(o.id);cm()}}
function addSup(){const o=mkSup($('#xsn1').value,$('#xsp1').value,$('#xsa1').value);if(o){const a=+$('#xsob').value||0;if(a>0){const id=D.n.u||1;D.n.u=id+1;PU().push({id,d:$('#xsobd').value||td(),inv:$('#xsobi').value.trim(),b:'',sup:o.id,p:0,q:0,a,t:'Cash',rm:'Supplier opening balance',ph:'',ps:'part',pd:0,pays:[],opening:true});}save();go('sup')}}
function addPur(){const sp=$('#xus').value,p=+$('#xup').value,q=+$('#xuq').value,a=+$('#xua').value,part=$('#xuk').value=='part',pd=part?(+$('#xupd').value||0):a;if(!sp||sp=='0')return alert('Select a supplier, or add a new one');if(!p)return alert('Select a product, or add a new one');if(!(q>0))return alert('Enter quantity');if(!(a>0))return alert('Enter total amount');if(pd<0||pd>a)return alert('Paid amount must be between 0 and the total');pic($('#xuf'),f=>{const id=D.n.u||1;D.n.u=id+1;const d=$('#xud').value||td(),inv=$('#xui').value.trim(),b=$('#xub').value.trim(),rm=$('#xur').value.trim(),t=$('#xut').value,pn=pnm(p);PU().push({id,d,inv,b,sup:sp,p,q,a,t,rm,ph:f,ps:part?'part':'full',pd,pays:pd>0?[{d,a:pd,t}]:[]});D.s.push({id:D.n.s++,d,inv,b,p,q,rm,ph:'',u:id});if(pd>0)D.x.push({id:D.n.x++,d,a:pd,x:'Purchase '+(inv||'#'+id)+' ('+sn(sp)+'): '+pn+' x'+q,p:0,q:0,k:'shop',t,u:id});save();go('pur');ntf(pn+' x'+q+' added to stock. '+R(pd)+' paid'+(a>pd?', '+R(a-pd)+' payable to '+sn(sp):'')+'.','','Purchase saved')},1)}
function gp(){const f=gv('xf1'),t=gv('xf2'),q=gv('xfq').toLowerCase(),s=gv('xfs'),d=+gv('xfd'),st=gv('xfp'),ty=gv('xft');return PU().filter(u=>(!f||u.d>=f)&&(!t||u.d<=t)&&(!s||u.sup==s)&&(!d||u.p==d)&&(!st||(st=='Due'?pdue(u)>0:pst(u)==st))&&(!ty||u.t==ty)&&(!q||(u.inv+u.b+pnm(u.p)+sn(u.sup)+u.rm).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id)}
const ptb=(r,act)=>`<div class=ov><table><tr><th>Date</th><th>Invoice</th><th>Batch</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Amount</th><th>Paid</th><th>Due</th><th>Status</th><th>Remarks</th>${act?'<th>Photo</th><th></th>':''}</tr>${r.map(u=>`<tr><td>${fd(u.d)}</td><td>${esc(u.inv)}</td><td>${esc(u.b)}</td><td><b>${esc(sn(u.sup))}</b></td><td>${esc(pnm(u.p))}</td><td>${u.q}</td><td>${R(u.a)}</td><td>${R(ppd(u))}</td><td>${R(pdue(u))}</td><td><span class="pl ${pst(u)=='Paid'?'ok':'pn'}">${pst(u)}</span></td><td>${esc(u.rm)}</td>${act?`<td>${u.ph?`<img src="${u.ph}" width=34 onclick="vph(${u.id})" style="cursor:pointer">`:''}</td><td><button class=b2 onclick="editPur(${u.id})">✏️</button>${pdue(u)>0?`<button class=b onclick="payPur(${u.id})">💵</button>`:''}<button class="b bd" onclick="delPur(${u.id})">🗑</button></td>`:''}</tr>`).join('')||'<tr><td colspan=13>No records</td></tr>'}<tr><th colspan=5>Total</th><th>${r.reduce((a,u)=>a+u.q,0)}</th><th>${R(sm(r))}</th><th>${R(r.reduce((a,u)=>a+ppd(u),0))}</th><th>${R(r.reduce((a,u)=>a+pdue(u),0))}</th><th colspan=${act?4:2}></th></tr></table></div>`;
const payT=r=>{const l=r.flatMap(u=>(u.pays||[]).map(p=>({...p,u}))).sort((a,b)=>b.d.localeCompare(a.d));return `<div class=ov><table><tr><th>Date</th><th>Supplier</th><th>Invoice</th><th>Product</th><th>Type</th><th>Amount</th></tr>${l.map(x=>`<tr><td>${fd(x.d)}</td><td><b>${esc(sn(x.u.sup))}</b></td><td>${esc(x.u.inv)}</td><td>${esc(pnm(x.u.p))}</td><td>${x.t}</td><td>${R(x.a)}</td></tr>`).join('')||'<tr><td colspan=6>No payments</td></tr>'}<tr><th colspan=5>Total paid</th><th>${R(sm(l))}</th></tr></table></div>`};
const supT=r=>{const m={};r.forEach(u=>{const o=m[u.sup]=m[u.sup]||{s:SP().find(x=>x.id==u.sup)||{id:'-',n:'(No supplier)',ph:'',ad:''},n:0,a:0,pd:0};o.n++;o.a+=u.a;o.pd+=ppd(u)});const v=Object.values(m),A=v.reduce((a,o)=>a+o.a,0),Pd=v.reduce((a,o)=>a+o.pd,0);return `<div class=ov><table><tr><th>ID</th><th>Supplier</th><th>Phone</th><th>Address</th><th>Purchases</th><th>Total Purchase</th><th>Paid</th><th>Payable</th></tr>${v.map(o=>`<tr><td>${o.s.id}</td><td><b>${esc(o.s.n)}</b></td><td><b>${esc(o.s.ph)}</b></td><td><b>${esc(o.s.ad)}</b></td><td>${o.n}</td><td>${R(o.a)}</td><td>${R(o.pd)}</td><td>${R(o.a-o.pd)}</td></tr>`).join('')||'<tr><td colspan=8>No records</td></tr>'}<tr><th colspan=4>Total (all suppliers)</th><th>${r.length}</th><th>${R(A)}</th><th>${R(Pd)}</th><th>${R(A-Pd)}</th></tr></table></div>`};
A.pur=()=>{$('#xl').innerHTML=`<div class=cd>${ptb(gp(),1)}<button class=b2 onclick="repPur()">🖨 Print Report</button></div>`};
const repPur=()=>modal(HD('Purchase Report')+ptb(gp())+SG(),'A4');
const vph=id=>modal(`<img src="${PU().find(u=>u.id==id).ph}" style="max-width:100%">`);
function delPur(id){if(!confirm('Delete this purchase? Its stock and payment entries are removed too.'))return;D.u=PU().filter(u=>u.id!=id);D.s=D.s.filter(x=>x.u!=id);D.x=D.x.filter(x=>x.u!=id);save();go(cur);ntf('Purchase deleted','w','Removed');chk()}
function editPur(id){const u=PU().find(z=>z.id==id);if(u.opening)return alert('Edit supplier opening balance from supplier records.');modal(`<h3>✏️ Edit Purchase</h3><div class=fg><label>Date<input type=date id=xed1 value="${u.d}"></label><label>Invoice No<input id=xei1 value="${esc(u.inv)}"></label><label>Batch No<input id=xeb1 value="${esc(u.b)}"></label><label>Supplier<select id=xes1>${sopt(u.sup)}</select></label><label>Product<select id=xep1>${popt(u.p)}</select></label><label>Quantity<input type=number id=xeq1 value="${u.q}"></label><label>Total Amount (PKR)<input type=number id=xea1 value="${u.a}"></label><label>New invoice photo (optional)<input type=file id=xef1 accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks<input id=xer1 value="${esc(u.rm)}"></label></div><div class=tt>Paid ${R(ppd(u))} · Due ${R(pdue(u))}</div><small>${u.ps=='full'?'Full payment: the paid amount follows the total.':'Partial payment: use the 💵 button to record further payments.'}</small><br><button class=b onclick="savePur(${id})">💾 Save</button>`)}
function savePur(id){const u=PU().find(z=>z.id==id),q=+$('#xeq1').value,a=+$('#xea1').value,p=+$('#xep1').value,sp=$('#xes1').value,full=u.ps=='full';if(!p||!(q>0)||!(a>0))return alert('Check product, quantity and amount');if(!sp||sp=='0')return alert('Select a supplier');if(!full&&a<u.pd)return alert('Total cannot be less than already paid ('+R(u.pd)+')');pic($('#xef1'),f=>{Object.assign(u,{d:$('#xed1').value||u.d,inv:$('#xei1').value.trim(),b:$('#xeb1').value.trim(),sup:sp,p,q,a,rm:$('#xer1').value.trim()});if(f)u.ph=f;if(full){u.pd=a;if(u.pays[0]){u.pays[0].a=a;u.pays[0].d=u.d}}D.s.filter(x=>x.u==id).forEach(x=>Object.assign(x,{d:u.d,inv:u.inv,b:u.b,p,q,rm:u.rm}));D.x.filter(x=>x.u==id).forEach(x=>{if(full){x.a=a;x.d=u.d}x.x='Purchase '+(u.inv||'#'+id)+' ('+sn(sp)+'): '+pnm(p)+' x'+q});save();cm();go(cur);ntf('Purchase updated','','Saved');chk()},1)}
function payPur(id){const u=PU().find(z=>z.id==id),r=pdue(u);modal(`<h3>💵 Pay Supplier</h3><div><b>${esc(sn(u.sup))}</b> · ${esc(u.inv||'#'+u.id)} · ${esc(pnm(u.p))}</div><div>Total ${R(u.a)} · Paid ${R(ppd(u))} · Payable ${R(r)}</div><div class=fg><label>Date<input type=date id=xpdt value="${td()}"></label><label>Amount (PKR)<input type=number id=xpam value="${r}" oninput="pcalp(${id})"></label><label>Paid from<select id=xpty><option>Cash<option>Online</select></label></div><div class=tt id=xpc></div><button class=b onclick="savePP(${id})">💾 Save Payment</button>`);pcalp(id)}
function pcalp(id){const u=PU().find(z=>z.id==id),a=Math.min(+$('#xpam').value||0,pdue(u));$('#xpc').innerHTML=`Paying now: ${R(a)}<br>Payable after: ${R(pdue(u)-a)}`}
function payTo(u,a,d,t){u.pd=ppd(u)+a;(u.pays=u.pays||[]).push({d,a,t});D.x.push({id:D.n.x++,d,a,x:'Payment to supplier '+sn(u.sup)+' for '+(u.inv||'#'+u.id),p:0,q:0,k:'shop',t,u:u.id})}
function savePP(id){const u=PU().find(z=>z.id==id),a=+$('#xpam').value;if(!(a>0))return alert('Enter amount');if(a>pdue(u))return alert('Amount is more than payable');payTo(u,a,$('#xpdt').value||td(),$('#xpty').value);save();cm();go(cur);ntf(R(a)+' paid to '+sn(u.sup)+'. Payable '+R(pdue(u)),'','Payment recorded')}

P.sup=()=>`<h2>🚚 Suppliers</h2><div class=tt>Total payable to suppliers: ${R(PD())}</div><div class=cd><h3>Add Supplier</h3><div class=fg><label>Name<input id=xsn1></label><label>Phone No<input id=xsp1 type=tel></label><label>Address (optional)<input id=xsa1></label><label>Opening Balance (optional, PKR)<input type=number id=xsob value=0></label><label>Opening Invoice / Reference (optional)<input id=xsobi></label><label>Balance Date<input type=date id=xsobd value="${td()}"></label></div><button class=b onclick="addSup()">➕ Add Supplier</button></div><div class=cd><h3>Supplier Purana Khata / Opening Balance</h3><div class=fg><label>Supplier<select id=xosup>${sopt(0)}</select></label><label>Previous Invoice / Reference (optional)<input id=xoinv></label><label>Date<input type=date id=xod value="${td()}"></label><label>Opening Payable (PKR)<input type=number id=xoa></label><label>Remarks (optional)<input id=xorm></label></div><button class=b onclick="addSupOB()">💾 Save Opening Balance</button></div><div class=cd><h3>Supplier Report</h3>${flt(`<label>Report<select id=xsr onchange="RF()"><option value=s>Supplier summary<option value=p>Purchases detail<option value=y>Payments made</select></label>${sfil()}<label>Product<select id=xfd onchange="RF()"><option value=0>All${D.p.map(p=>`<option value=${p.id}>${esc(p.n)}`).join('')}</select></label>${stfil()}<label>Payment type<select id=xft onchange="RF()"><option value="">Any<option>Cash<option>Online</select></label><label>Search<input id=xfq oninput="RF()"></label>`)}<button class=b2 onclick="repSup()">🖨 Print Report</button></div><div id=xl></div>`;
function addSupOB(){const sp=$('#xosup').value,a=+$('#xoa').value;if(!sp||sp=='0')return alert('Select supplier');if(!(a>0))return alert('Enter opening balance');const id=D.n.u||1;D.n.u=id+1;PU().push({id,d:$('#xod').value||td(),inv:$('#xoinv').value.trim(),b:'',sup:sp,p:0,q:0,a,t:'Cash',rm:$('#xorm').value.trim()||'Supplier opening balance',ph:'',ps:'part',pd:0,pays:[],opening:true});save();go('sup');ntf('Opening balance added for '+sn(sp),'','Saved') }
const supRep=()=>{const r=gp(),k=gv('xsr')||'s';return k=='s'?supT(r):k=='p'?ptb(r):payT(r)};
A.sup=()=>{const rows=SP().map(s=>{const r=PU().filter(u=>u.sup==s.id);return{s,a:r.reduce((x,u)=>x+u.a,0),p:r.reduce((x,u)=>x+ppd(u),0)}}),A=rows.reduce((x,o)=>x+o.a,0),Pd=rows.reduce((x,o)=>x+o.p,0);$('#xl').innerHTML=`<div class="cd ov"><h3>Supplier List (all time)</h3><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Address</th><th>Purchased</th><th>Paid</th><th>Payable</th><th></th></tr>${rows.map(o=>`<tr><td>${o.s.id}</td><td><b>${esc(o.s.n)}</b></td><td><b>${esc(o.s.ph)}</b></td><td><b>${esc(o.s.ad)}</b></td><td>${R(o.a)}</td><td>${R(o.p)}</td><td class="${o.a>o.p?'low':''}">${R(o.a-o.p)}</td><td>${o.a>o.p?`<button class=b onclick="paySup('${o.s.id}')">💵</button>`:''}<button class=b2 onclick="ledS('${o.s.id}')">📒</button><button class="b bd" onclick="delSup('${o.s.id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan=8>No suppliers yet</td></tr>'}<tr><th colspan=4>Total</th><th>${R(A)}</th><th>${R(Pd)}</th><th>${R(A-Pd)}</th><th></th></tr></table></div><div class=cd>${supRep()}</div>`};
const repSup=()=>modal(HD({s:'Supplier Summary Report',p:'Supplier Purchases Report',y:'Supplier Payments Report'}[gv('xsr')||'s'])+supRep()+SG(),'A4');
function ledS(id){const s=SP().find(x=>x.id==id),r=PU().filter(u=>u.sup==id).sort((a,b)=>a.d.localeCompare(b.d));modal(HD('Supplier Account')+`<div><b>${s.id} · ${esc(s.n)} · ${esc(s.ph)}${s.ad?' · '+esc(s.ad):''}</b></div><p style="text-align:right"><b>Total Payable: ${R(r.reduce((a,u)=>a+pdue(u),0))}</b></p><h4>Purchases</h4>${ptb(r)}<h4>Payments made</h4>${payT(r)}`+SG(),'A4')}
function delSup(id){if(PU().some(u=>u.sup==id))return alert('This supplier has purchases and cannot be deleted.');if(confirm('Delete supplier?')){D.sp=SP().filter(x=>x.id!=id);save();go('sup')}}
function paySup(id){const r=PD2(id);modal(`<h3>💵 Pay Supplier</h3><div><b>${esc(sn(id))}</b></div><div>Total payable ${R(r)} (applied to oldest purchases first)</div><div class=fg><label>Date<input type=date id=xpdt value="${td()}"></label><label>Amount (PKR)<input type=number id=xpam value="${r}" oninput="pcals('${id}')"></label><label>Paid from<select id=xpty><option>Cash<option>Online</select></label></div><div class=tt id=xpc></div><button class=b onclick="saveSP('${id}')">💾 Save Payment</button>`);pcals(id)}
const PD2=id=>PU().filter(u=>u.sup==id).reduce((a,u)=>a+pdue(u),0);
function pcals(id){const a=Math.min(+$('#xpam').value||0,PD2(id));$('#xpc').innerHTML=`Paying now: ${R(a)}<br>Payable after: ${R(PD2(id)-a)}`}
function saveSP(id){let a=+$('#xpam').value;if(!(a>0))return alert('Enter amount');if(a>PD2(id))return alert('Amount is more than payable');const d=$('#xpdt').value||td(),t=$('#xpty').value,tot=a;PU().filter(u=>u.sup==id&&pdue(u)>0).sort((x,y)=>x.d.localeCompare(y.d)||x.id-y.id).forEach(u=>{const x=Math.min(a,pdue(u));if(x>0){payTo(u,x,d,t);a-=x}});save();cm();go('sup');ntf(R(tot)+' paid to '+sn(id)+'. Payable '+R(PD2(id)),'','Payment recorded')}
/* DASHBOARD */
const FARM=k=>`<svg viewBox="0 0 600 220" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><defs><linearGradient id="a${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#dff3cf"/></linearGradient><linearGradient id="b${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7acb52"/><stop offset="1" stop-color="#1e7a3e"/></linearGradient></defs><rect width="600" height="220" fill="url(#a${k})"/><circle cx="470" cy="62" r="44" fill="#ffd45e" opacity=".9"/><path d="M0 118Q130 88 260 114T600 98V220H0Z" fill="#a6da86"/><path d="M0 140Q150 112 300 138T600 124V220H0Z" fill="url(#b${k})"/>${Array.from({length:14},(_,i)=>`<path d="M${300+(i-6.5)*9} 138L${300+(i-6.5)*90} 220" stroke="#0f5a2a" stroke-width="3" opacity=".3"/>`).join('')}<path d="M40 150Q44 130 52 126M52 150Q52 134 62 130M64 152Q62 138 72 136" stroke="#e8c53a" stroke-width="3" fill="none"/><g transform="translate(380 112)"><rect x="18" y="34" width="84" height="30" rx="6" fill="#2e9b3a"/><rect x="62" y="8" width="40" height="32" rx="4" fill="#3fae5a"/><rect x="68" y="14" width="27" height="18" rx="2" fill="#d6f0fb"/><rect x="2" y="44" width="20" height="5" fill="#555"/><circle cx="36" cy="72" r="22" fill="#1c2a21"/><circle cx="36" cy="72" r="10" fill="#f2c200"/><circle cx="98" cy="78" r="14" fill="#1c2a21"/><circle cx="98" cy="78" r="6" fill="#f2c200"/></g></svg>`;
const WHEAT=`<svg viewBox="0 0 160 200" style="position:absolute;right:0;bottom:0;height:78%">${[-28,-10,8,26].map(a=>`<g transform="rotate(${a} 90 200)"><path d="M90 200V58" stroke="#4a9a3a" stroke-width="3"/>${Array.from({length:7},(_,i)=>`<ellipse cx="${i%2?100:80}" cy="${60+i*11}" rx="6" ry="11" fill="#e2b33c" transform="rotate(${i%2?25:-25} ${i%2?100:80} ${60+i*11})"/>`).join('')}</g>`).join('')}<path d="M20 200Q70 150 120 200ZM60 200Q110 140 160 200Z" fill="#2e9b3a" opacity=".85"/></svg>`;
const PM=()=>`<div class=pm style="position:relative;overflow:hidden;padding:0"><div style="position:relative;height:100px">${FARM('s')}</div><div style="padding:12px"><b style="margin:0">Smarter Decisions for a Stronger Harvest</b></div></div>`;
const dlt=(a,b)=>b>0?`<span style="color:${a>=b?'var(--g)':'var(--r)'};font-weight:600">${a>=b?'↑':'↓'} ${Math.abs((a-b)/b*100).toFixed(1)}%</span> vs yesterday`:'Today so far';
const dy=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)},w7=f=>[6,5,4,3,2,1,0].map(n=>f(dy(n)));
let PR='all';const PC=()=>PR=='7'?dy(6):PR=='30'?dy(29):'',setPR=k=>{PR=k;go('dash')};
const tp=()=>{const m={},c=PC();D.i.filter(v=>!c||v.d>=c).forEach(v=>v.it.forEach(x=>m[x.n]=(m[x.n]||0)+x.q*x.pr));const a=Object.entries(m).sort((x,y)=>y[1]-x[1]),cs=['#2e9b57','#f59e0b','#3b82f6','#8b5cf6','#9ca3af'],t=a.slice(0,4).map((x,i)=>({n:x[0],v:x[1],c:cs[i]})),o=a.slice(4).reduce((s,x)=>s+x[1],0);if(o)t.push({n:'Others',v:o,c:cs[4]});return t};
const dnt=(ps,T,pie)=>{const r=pie?30:42,w=pie?60:16,C=2*Math.PI*r;let off=0;return `<svg viewBox="0 0 120 120" style="width:100%;height:100%;transform:rotate(-90deg)">`+ps.map(p=>{const l=p.v/T*C,e=`<circle cx=60 cy=60 r=${r} fill=none stroke="${p.c}" stroke-width=${w} stroke-dasharray="${l} ${C-l}" stroke-dashoffset=${-off}><title>${esc(p.n)}: ${R(p.v)}</title></circle>`;off+=l;return e}).join('')+'</svg>'};

const leg=(ps,T)=>ps.map(x=>`<div class=it style="display:flex;justify-content:space-between;gap:8px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${x.c};margin-right:6px"></i>${esc(x.n)}</span><span><b>${Math.round(x.v/T*100)}%</b> <small style="color:var(--m)">${R(x.v)}</small></span></div>`).join('');

<div class=kr>${K.map(kc).join('')}</div>
<div class=d2><div class=cd><div class=ch><h3>Sales by Product</h3>${rb}</div>${tv.length?`<div class="dn pie">${dnt(tv,T,1)}</div>`+leg(tv,T):'<div class=it>No sales in this period</div>'}</div>
<div class=cd><div class=ch><h3>Cash vs Online Received</h3>${rb}</div>${pt.length?`<div class=dn><div style="position:absolute;inset:0">${dnt(pt,T2)}</div><span>${R(T2).replace('PKR ','')}<small>PKR received</small></span></div>`+leg(pt,T2):'<div class=it>No payments in this period</div>'}</div>
<div class=cd><div class=ch><h3>${ic('alert',18)} Stock Alerts &amp; Dues</h3><button class=b2 onclick="go('pur')">Purchase</button></div>${lw.slice(0,4).map(p=>`<div class="it low">${esc(p.n)}: ${qt(p.id)} left</div>`).join('')}${dues.map(c=>`<div class=it>💵 <b>${esc(c.n)}</b> owes ${R(due(c.n))}</div>`).join('')}${lw.length||dues.length?'':'<div class=it>✅ No alerts</div>'}<button class=b3 onclick="go('fin')">All reports →</button></div></div>

<div class="cd qa"><h3>Quick Actions</h3><button class=b onclick="go('inv')">🧾 New Invoice</button><button class=b onclick="go('pur')">🛒 Purchase</button><button class=b onclick="go('sup')">🚚 Suppliers</button><button class=b onclick="go('stock')">📦 Stock</button><button class=b onclick="go('sales')">💰 Add Income</button><button class=b2 onclick="go('exp')">💸 Expense</button><button class=b2 onclick="go('self')">🙋 Self Expense</button><button class=b2 onclick="go('fin')">📊 Reports</button><button class=b2 onclick="go('cust')">👥 Customers</button></div>`};

if(w('Sales')&&!du){const r=D.l.filter(x=>m(x.c+' '+x.x)&&dok(x.d)&&(!py||x.t==py));o+=cd('Sales ('+r.length+')',tbl(r))}
if(w('Stock')&&!py&&!du){const r=D.s.filter(x=>m(pnm(x.p)+' '+x.inv+' '+x.b+' '+x.rm)&&dok(x.d));o+=cd('Stock Entries ('+r.length+')',`<table><tr><th>Date</th><th>Inv No</th><th>Batch</th><th>Product</th><th>Qty</th></tr>${r.map(x=>`<tr><td>${fd(x.d)}</td><td>${esc(x.inv)}</td><td>${esc(x.b)}</td><td>${esc(pnm(x.p))}</td><td>${x.q}</td></tr>`).join('')}</table>`)}

$('#xl').innerHTML=o||'<div class=cd>No results</div>'};

/* SALES */
P.sales=()=>`<h2>Sales / Income</h2><div class=cd><h3>Add Income</h3><div class=fg><label>Date<input type=date id=xsd1 value="${td()}"></label><label>Customer<input id=xsc list=cl onclick="pickCustomer('xsc')" readonly placeholder="Select customer"></label><label>Details<input id=xsx></label><label>Income (PKR)<input type=number id=xsa></label><label>Income Type<select id=xst><option>Cash<option>Online</select></label></div><button class=b onclick="addSale()">➕ Add Income</button><button class=b2 onclick="otherPayment()">➕ Other Payment (Non-Stock Income)</button></div>
<div class=cd><h3>Filters</h3>${flt('<label>Type<select id=xft onchange="RF()"><option value="">All<option>Cash<option>Online</select></label><label>Search<input id=xfq oninput="RF()"></label>')}<button class=b2 onclick="repSales()">🖨 Print Report</button></div><div id=xl></div>`;

function saveOtherPayment(){const n=$('#xopn').value.trim()||'Walk-in',a=+$('#xopo').value;if(!(a>0))return alert('Enter amount');let c=D.c.find(x=>x.n.toLowerCase()==n.toLowerCase());if(!c&&n!='Walk-in'){c={id:'C-'+pad(D.n.c++),n,ph:$('#xopp').value.trim(),ad:$('#xopa').value.trim(),ob:0};D.c.push(c)}else if(c){c.ph=$('#xopp').value.trim()||c.ph;c.ad=$('#xopa').value.trim()||c.ad}D.l.push({id:D.n.l++,d:$('#xopd').value||td(),c:n,x:$('#xopx').value.trim()+(($('#xopr').value.trim())?' · Ref '+$('#xopr').value.trim():''),a,t:$('#xopt').value,other:true});save();cm();go('sales');ntf(R(a)+' other income recorded','','Saved')}
function gs(){const f=$('#xf1').value,t=$('#xf2').value,ty=$('#xft').value,q=$('#xfq').value.toLowerCase();return D.l.filter(x=>(!f||x.d>=f)&&(!t||x.d<=t)&&(!ty||x.t==ty)&&(!q||(x.c+' '+x.x).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id)}

P.stock=()=>`<h2>Stock</h2>${low().length?`<div class=cd style="border-color:var(--r)">${lowH()}</div>`:''}
<div class=cd><h3>Add Stock Quantity</h3><div class=fg><label>Date<input type=date id=xsd value="${td()}"></label><label>Invoice No<input id=xsi></label><label>Batch No<input id=xsb></label><label>Product<select id=xsp>${D.p.map(p=>`<option value=${p.id}>${esc(p.n)}`).join('')}</select></label><label>Quantity<input type=number id=xsq></label><label>Photo (jpg, jpeg, png)<input type=file id=xpf accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks<input id=xsr></label></div><button class=b onclick="addStock()">➕ Add Stock</button></div>

<div class=cd><label>Search stock entries<input id=xfq oninput="RF()"></label></div><div id=xl></div>`;
A.stock=()=>{const q=$('#xfq').value.toLowerCase(),nm=id=>(D.p.find(p=>p.id==id)||{}).n||'?';$('#xl').innerHTML=`<div class=cd><h3>Current Stock</h3><div class=ov><table><tr><th>Product</th><th>In Stock</th></tr>${D.p.map(p=>`<tr><td>${esc(p.n)}</td><td class="${qt(p.id)<10?'low':''}">${qt(p.id)}</td></tr>`).join('')}</table></div></div><div class=cd><h3>Stock Entries</h3><div class=ov><table><tr><th>Date</th><th>Inv No</th><th>Batch</th><th>Product</th><th>Qty</th><th>Photo</th><th>Remarks</th><th></th></tr>${D.s.filter(x=>!q||(nm(x.p)+x.inv+x.b).toLowerCase().includes(q)).reverse().map(x=>`<tr><td>${fd(x.d)}</td><td>${esc(x.inv)}</td><td>${esc(x.b)}</td><td>${esc(nm(x.p))}</td><td>${x.q}</td><td>${x.ph?`<img src="${x.ph}" width=30>`:''}</td><td>${esc(x.rm)}</td><td><button class=b2 onclick="editS(${x.id})">✏️ Edit</button><button class="b bd" onclick="delS(${x.id})">🗑 Delete</button></td></tr>`).join('')}</table></div></div>`};

function addOpeningStock(){const p=+$('#xosp').value,q=+$('#xosq').value;if(!p)return alert('Select product');if(!(q>0))return alert('Enter quantity');D.s.push({id:D.n.s++,d:$('#xosd').value||td(),inv:$('#xosi').value.trim(),b:'',p,q,rm:$('#xosr').value.trim()||'Opening stock',ph:'',opening:true});save();go('stock');ntf(pnm(p)+' opening stock added: '+q,'','Saved')}

function fill(){const c=D.c.find(c=>c.n.toLowerCase()==$('#xn').value.trim().toLowerCase());if(c){$('#xp').value=c.ph;$('#xa').value=c.ad||'';$('#xk').checked=false;$('#xold').value=c.ob||0;$('#xoldinv').value=c.obInv||'';calc()}}
function cq(id,d){const m=qt(id);let q=(C[id]||0)+d;if(q<0)q=0;if(q>m){q=m;alert('Only '+m+' in stock')}C[id]=q;$('#xq'+id).textContent=q;calc()}
function calc(){const s=D.p.reduce((a,p)=>a+(C[p.id]||0)*p.pr,0),d=+$('#xd').value||0,old=Math.max(0,+($('#xold')?$('#xold').value:0)||0),t=Math.max(0,s-d+old),pv=$('#xpd').value,pd=pv===''?t:Math.min(+pv,t);const ni=D.p.reduce((a,p)=>a+(C[p.id]||0),0),e=$('#xtt');if(e)e.innerHTML=`<table style="width:100%"><tr><td>Items (qty)</td><td style="text-align:right">${ni}</td></tr><tr><td>Subtotal</td><td style="text-align:right">${R(s)}</td></tr><tr><td>Discount</td><td style="text-align:right">- ${R(d)}</td></tr><tr><td>Previous Balance</td><td style="text-align:right">${R(old)}</td></tr><tr><td><b>Total Payment</b></td><td style="text-align:right;font-size:18px"><b>${R(t)}</b></td></tr><tr><td>Paid</td><td style="text-align:right">${R(pd)}</td></tr><tr><td class=low>Remaining</td><td style="text-align:right" class=low>${R(t-pd)}</td></tr></table>`;return{s,d,t,pd,old}}
function pl(){const q=$('#xps').value.toLowerCase();$('#xpg').innerHTML=D.p.filter(p=>p.n.toLowerCase().includes(q)).map(p=>`<div class=pc><div class=ph>${p.ph?`<img src="${p.ph}">`:'🌿'}</div><b>${esc(p.n)}</b><br><small>${R(p.pr)} · Stock ${qt(p.id)}</small><div class=qs><button onclick="cq(${p.id},-1)">−</button><span id=xq${p.id}>${C[p.id]||0}</span><button onclick="cq(${p.id},1)">+</button></div></div>`).join('')||'No products'}
A.inv=()=>{pl();calc();A.invs()};
function saveInv(pr){const n=$('#xn').value.trim();if(!n)return alert('Enter customer name');const its=D.p.filter(p=>C[p.id]>0).map(p=>({pid:p.id,n:p.n,pr:p.pr,q:C[p.id]}));const k=calc();if(!its.length&&k.old<=0)return alert('Select products or enter a previous balance');const id='INV-'+pad(D.n.i++,4),pn=$('#xp').value.trim(),ad=$('#xa').value.trim();
let c=D.c.find(c=>c.n.toLowerCase()==n.toLowerCase());if(!c&&$('#xk').checked){c={id:'C-'+pad(D.n.c++),n,ph:pn,ad};D.c.push(c)}
const ty=document.querySelector('[name=pt]:checked').value,v={id,d:$('#xidate').value||td(),cust:n,ph:pn||(c&&c.ph)||'',ad,it:its,sub:k.s,dis:k.d,old:k.old,oldInv:$('#xoldinv').value.trim(),tot:k.t,pd:k.pd,t:ty,rm:$('#xr').value.trim()};if(c&&k.old>0)c.ob=Math.max(0,(+c.ob||0)-k.old);
D.i.push(v);if(k.pd>0)D.l.push({id:D.n.l++,d:v.d,c:n,x:'Invoice '+id,a:k.pd,t:ty,v:id});C={};save();go('inv');showInv(id);ntf('Invoice '+id+' saved for '+n+' - '+R(k.t),'','Invoice saved');chk();if(pr)setTimeout(prn,400)}
const UN=pid=>((D.p.find(p=>p.id==pid)||{}).u)||'Pcs',N0=x=>Math.round(x).toLocaleString('en-US');
const LEAF=`<svg class=ivl viewBox="0 0 200 110"><path d="M200 0V70Q150 70 120 30Q150 0 200 0Z" fill="#4a1fa8"/><path d="M200 0Q150 10 110 50Q150 60 200 30Z" fill="#9a82e6"/><path d="M200 20Q165 40 150 90Q190 80 200 60Z" fill="#3a1a94"/><path d="M130 0Q100 10 90 30Q120 28 130 0Z" fill="#ffb300"/></svg>`;
const WAVE=`<svg class=ivw viewBox="0 0 600 140" preserveAspectRatio="none"><path d="M0 50Q160 10 340 70T600 100V140H0Z" fill="#3a1a94"/><path d="M0 64Q170 30 340 86T600 112" fill="none" stroke="#ffb300" stroke-width="5"/><path d="M0 76Q180 48 340 100T600 126V140H0Z" fill="#9a82e6"/></svg>`;
const payG=v=>{const l=D.l.filter(x=>x.v==v.id).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);return l.length?`<div class=ivp><b>Payments Received</b>${l.map(x=>`<div><span>${fd(x.d)}</span><span>${x.t}</span><span>${R(x.a)}</span></div>`).join('')}</div>`:''};
const invDoc=v=>{const rem=v.tot-v.pd;return HD('Sale Invoice')+`<div class=ivinf><div><b>Invoice No:</b> ${esc(v.id)}</div><div><b>Date:</b> ${fd(v.d)}</div><div><b>Customer:</b> ${esc(v.cust)}</div>${v.ph?`<div><b>Phone:</b> ${esc(v.ph)}</div>`:''}<div style="grid-column:1/-1"><b>Address:</b> ${esc(v.ad||'—')}</div></div><table><tr><th>Sr.</th><th>Description</th><th>Qty</th><th>Unit</th><th>Rate (Rs.)</th><th>Amount (Rs.)</th></tr>${v.it.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td class=nr>${x.q}</td><td>${esc(UN(x.pid))}</td><td class=nr>${N0(x.pr)}</td><td class=nr>${N0(x.q*x.pr)}</td></tr>`).join('')}</table><div class=ivx2><div><span>Sub Total:</span><span>${N0(v.sub)}</span></div><div><span>Discount:</span><span>${N0(v.dis)}</span></div>${v.old?`<div><span>Previous Balance${v.oldInv?' ('+esc(v.oldInv)+')':''}:</span><span>${N0(v.old)}</span></div>`:''}<div class=tot><span>Total:</span><span>${N0(v.tot)}</span></div><div><span>Paid:</span><span>${N0(v.pd)}</span></div><div class="${rem>0?'rd':''}"><span>Remaining:</span><span>${N0(rem)}</span></div></div>${payG(v)}${v.rm?`<div class=ivtc><b>Remarks:</b> ${esc(v.rm)}</div>`:''}${SG()}`};
const msg=v=>D.set.sms.replace(/\{(\w+)\}/g,(a,k)=>({name:v.cust,inv:v.id,total:v.tot,paid:v.pd,due:v.tot-v.pd,date:fd(v.d),type:v.t})[k]??a);
const payTb=v=>{const l=D.l.filter(x=>x.v==v.id).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);return l.length?`<h4 style="margin:6px 0 2px">Payments Received</h4><table><tr><th>Date</th><th>Type</th><th>Amount</th></tr>${l.map(x=>`<tr><td>${fd(x.d)}</td><td>${x.t}</td><td>${R(x.a)}</td></tr>`).join('')}</table>`:''};
function showInv(id,z){const v=D.i.find(x=>x.id==id),m=encodeURIComponent(msg(v)),sz=z||'A4';modal(invDoc(v),sz,`<button class=b2 onclick="showInv('${id}','A6')">A6</button><button class=b2 onclick="showInv('${id}','A4')">A4</button>${v.tot>v.pd?`<button class=b2 onclick="payInv('${id}')">💵 Payment</button>`:''}<a class=b2 target="_blank" href="https://wa.me/${ph(v.ph)}?text=${m}">WhatsApp</a><a class=b2 href="sms:${esc(v.ph)}?body=${m}">SMS</a>`)}
function payInv(id){const v=D.i.find(x=>x.id==id),r=v.tot-v.pd;if(r<=0)return alert('Invoice is fully paid');modal(`<h3>💵 Record Payment ${id}</h3><div><b>${esc(v.cust)}</b></div><div>Total ${R(v.tot)} · Paid ${R(v.pd)} · Remaining ${R(r)}</div><div class=fg><label>Date<input type=date id=xpdt value="${td()}"></label><label>Amount (PKR)<input type=number id=xpam value="${r}" oninput="pcalc('${id}')"></label><label>Type<select id=xpty><option>Cash<option>Online</select></label></div><div class=tt id=xpc></div><button class=b onclick="savePay('${id}')">💾 Save &amp; Show Receipt</button>`);pcalc(id)}
function pcalc(id){const v=D.i.find(x=>x.id==id),a=Math.min(+$('#xpam').value||0,v.tot-v.pd);$('#xpc').innerHTML=`Paying now: ${R(a)}<br>Remaining after: ${R(v.tot-v.pd-a)}`}
function savePay(id){const v=D.i.find(x=>x.id==id),a=+$('#xpam').value;if(!(a>0))return alert('Enter amount');if(a>v.tot-v.pd)return alert('Amount is more than remaining');const t=$('#xpty').value;v.pd+=a;D.l.push({id:D.n.l++,d:$('#xpdt').value||td(),c:v.cust,x:'Payment for '+id,a,t,v:id});save();bell0();go('inv');itab(2);showInv(id);ntf(R(a)+' received from '+v.cust+'. Remaining '+R(v.tot-v.pd),'','Payment recorded')}

/* INVOICE RECORDS */
const RB=()=>`<div class=cd>${flt('<label>Search<input id=xfq oninput="RF()"></label><label>Status<select id=xft onchange="RF()"><option value="">All<option value=d>Remaining due<option value=p>Fully paid</select></label>')}<button class=b2 onclick="repInv()">🖨 Print Report</button></div><div id=xl></div>`;

function gi(){const f=$('#xf1').value,t=$('#xf2').value,s=$('#xft').value,q=$('#xfq').value.toLowerCase();return D.i.filter(v=>(!f||v.d>=f)&&(!t||v.d<=t)&&(!q||(v.cust+v.id).toLowerCase().includes(q))&&(!s||(s=='d')==(v.tot>v.pd))).reverse()}
const itb=(r,act)=>`<div class=ov><table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th>${act?'<th></th>':''}</tr>${r.map(v=>`<tr><td>${v.id}</td><td>${fd(v.d)}</td><td><b>${esc(v.cust)}</b></td><td>${R(v.tot)}</td><td>${R(v.pd)}</td><td>${R(v.tot-v.pd)}</td>${act?`<td><button class=b2 onclick="showInv('${v.id}')">🧾</button>${v.tot>v.pd?`<button class=b2 onclick="payInv('${v.id}')">💵</button>`:''}<button class=b onclick="editInv('${v.id}')">✏️ Edit</button><button class="b bd" onclick="delInv('${v.id}')">🗑 Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan=7>No records</td></tr>'}<tr><th colspan=3>Total</th><th>${R(r.reduce((a,v)=>a+v.tot,0))}</th><th>${R(r.reduce((a,v)=>a+v.pd,0))}</th><th>${R(r.reduce((a,v)=>a+v.tot-v.pd,0))}</th>${act?'<th></th>':''}</tr></table></div>`;
function delInv(id){if(!confirm('Delete invoice '+id+'? Linked customer payment records will also be removed.'))return;D.i=D.i.filter(v=>v.id!=id);D.l=D.l.filter(x=>x.v!=id);save();cm();go('inv');itab(2);bell0()}

function repInv(){modal(HD('Invoice Records')+itb(gi())+SG(),'A4')}

function pickCustomer(target){
 const rows=D.c.map((c,i)=>`<tr style="cursor:pointer" onclick="chooseCustomer(${i},'${target}')"><td><b>${esc(c.n)}</b></td><td>${esc(c.ph||'')}</td><td>${R(due(c.n))}</td><td><button class=b2 onclick="event.stopPropagation();chooseCustomer(${i},'${target}')">Select</button></td></tr>`).join('')||'<tr><td colspan=4>No customers found</td></tr>';
 modal(`<h3>👥 Select Customer</h3><div class=ov><table><tr><th>Customer</th><th>Phone</th><th>Due</th><th></th></tr>${rows}</table></div><div style="margin-top:12px"><button class=b3 onclick="cmx()">Cancel</button></div>`);
}

/* CUSTOMERS */
P.cust=()=>`<h2>Customers</h2><div class=cd><h3>Add Customer (ID: C-${pad(D.n.c)})</h3><div class=fg><label>Name<input id=xcn></label><label>Phone No<input id=xcp type=tel></label><label>Address (optional)<input id=xca></label><label>Opening Balance / Purana Khata (optional, PKR)<input type=number id=xcob value=0></label><label>Previous Invoice No (optional)<input id=xcobi></label><label>Balance Date<input type=date id=xcobd value="${td()}"></label></div><button class=b onclick="addCust()">➕ Add Customer</button></div><div class=cd><div class=fg><label>Search<input id=xfq oninput="RF()"></label><label>Filter<select id=xft onchange="RF()"><option value="">All<option value=d>With dues</select></label></div></div><div id=xl></div>`;
A.cust=()=>{const q=$('#xfq').value.toLowerCase(),f=$('#xft').value;$('#xl').innerHTML=`<div class="cd ov"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Address</th><th>Due</th><th></th></tr>${D.c.map((c,i)=>[c,i]).filter(([c])=>(!q||(c.n+c.ph+c.id).toLowerCase().includes(q))&&(!f||due(c.n)>0)).map(([c,i])=>`<tr><td>${c.id}</td><td>${esc(c.n)}</td><td>${esc(c.ph)}</td><td>${esc(c.ad)}</td><td class="${due(c.n)>0?'low':''}">${R(due(c.n))}</td><td><button class=b onclick="recv(${i})">💵</button><button class=b2 onclick="ledger(${i})">📒</button>${due(c.n)>0?sendB(c.n,c.ph,due(c.n)):''}<button class="b bd" onclick="delCust(${i})">🗑</button></td></tr>`).join('')||'<tr><td colspan=6>No customers</td></tr>'}</table></div>`};
function addCust(){const n=$('#xcn').value.trim();if(!n)return alert('Enter name');D.c.push({id:'C-'+pad(D.n.c++),n,ph:$('#xcp').value.trim(),ad:$('#xca').value.trim(),ob:Math.max(0,+$('#xcob').value||0),obInv:$('#xcobi').value.trim(),obDate:$('#xcobd').value||td()});save();go('cust')}
function delCust(i){if(confirm('Delete customer?')){D.c.splice(i,1);save();go('cust')}}
function recv(i){const c=D.c[i],d=due(c.n);if(d<=0)return alert('No dues');let a=+prompt('Due '+R(d)+'. Amount received (PKR)?',d);if(!(a>0))return;a=Math.min(a,d);const ty=confirm('OK = Cash, Cancel = Online')?'Cash':'Online';let r=a;if(c.ob>0){const x=Math.min(r,c.ob);c.ob-=x;r-=x;D.l.push({id:D.n.l++,d:td(),c:c.n,x:'Payment against opening balance '+(c.obInv||''),a:x,t:ty,openingPayment:true})}D.i.filter(v=>v.cust.toLowerCase()==c.n.toLowerCase()&&v.tot>v.pd).forEach(v=>{const x=Math.min(r,v.tot-v.pd);if(x>0){v.pd+=x;r-=x;D.l.push({id:D.n.l++,d:td(),c:c.n,x:'Payment received '+v.id,a:x,t:ty,v:v.id})}});save();go('cust');ntf(R(a)+' received from '+c.n,'','Payment received')}
const itl=r=>`<div class=ov><table><tr><th>Invoice</th><th>Date</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${r.map(v=>v.it.map(x=>`<tr><td>${v.id}</td><td>${fd(v.d)}</td><td>${esc(x.n)}</td><td>${x.q}</td><td>${x.pr}</td><td>${x.q*x.pr}</td></tr>`).join('')).join('')||'<tr><td colspan=6>No records</td></tr>'}<tr><th colspan=3>Total</th><th>${r.reduce((a,v)=>a+v.it.reduce((b,x)=>b+x.q,0),0)}</th><th></th><th>${r.reduce((a,v)=>a+v.it.reduce((b,x)=>b+x.q*x.pr,0),0)}</th></tr></table></div>`;
function ledger(i){const c=D.c[i],iv=D.i.filter(v=>v.cust.toLowerCase()==c.n.toLowerCase()),py=D.l.filter(x=>x.c.toLowerCase()==c.n.toLowerCase());modal(HD('Customer Payment Record')+`<div><b>${c.id} · ${esc(c.n)} · ${esc(c.ph)}${c.ad?' · '+esc(c.ad):''}</b></div><p style="text-align:right"><b>Total Due: ${R(due(c.n))}</b></p><h4>Products Purchased</h4>${itl(iv)}<h4>Invoices</h4>${itb(iv)}<h4>Payments</h4>${tbl(py)}`+SG(),'A4')}

/* PRODUCTS */
P.prod=()=>`<h2>Product List</h2><div class=cd><h3>Add Product</h3><div class=fg><label>Product Name<input id=xpn></label><label>Price (PKR)<input type=number id=xpp></label><label>Unit (Maund, Bag, Pcs…)<input id=xpu placeholder="Pcs"></label><label>Photo (jpg, jpeg, png - 3:4)<input type=file id=xpf accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks (optional)<input id=xpr></label></div><button class=b onclick="addProd()">➕ Add Product</button></div><div class=pg>${D.p.map((p,i)=>`<div class=pc><div class=ph>${p.ph?`<img src="${p.ph}">`:'🌿'}</div><b>${esc(p.n)}</b><br>${R(p.pr)}<br><small>${esc(p.rm||'')} Stock: ${qt(p.id)}</small><br><button class=b2 onclick="editP(${i})">✏️ Edit</button><button class="b bd" onclick="delP(${i})">🗑</button></div>`).join('')}</div>`;
function addProd(){const n=$('#xpn').value.trim(),pr=+$('#xpp').value;if(!n||!(pr>0))return alert('Enter name and price');pic($('#xpf'),f=>{D.p.push({id:D.n.p++,n,pr,u:$('#xpu').value.trim(),ph:f,rm:$('#xpr').value});save();go('prod')})}
function editP(i){const p=D.p[i];modal(`<h3>Edit Product</h3><div class=fg><label>Name<input id=xen value="${esc(p.n)}"></label><label>Price (PKR)<input type=number id=xep value="${p.pr}"></label><label>Unit<input id=xeu value="${esc(p.u||'')}" placeholder="Pcs"></label><label>New photo (optional)<input type=file id=xef accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks<input id=xer value="${esc(p.rm||'')}"></label></div><button class=b onclick="saveP(${i})">💾 Save</button>`)}
function saveP(i){const n=$('#xen').value.trim(),pr=+$('#xep').value;if(!n||!(pr>0))return alert('Enter name and price');pic($('#xef'),f=>{const p=D.p[i];p.n=n;p.pr=pr;p.u=$('#xeu').value.trim();p.rm=$('#xer').value;if(f)p.ph=f;save();cm();go('prod')})}
function delP(i){if(confirm('Delete product?')){D.p.splice(i,1);save();go('prod')}}

/* FINANCIAL */
function itab(n){$('#xnew').style.display=n==1?'block':'none';$('#xrec').style.display=n==2?'block':'none';if(n==2)A.invs()}
function editInv(id){const v=D.i.find(x=>x.id==id);modal(`<h3>Edit ${v.id}</h3><div class=fg><label>Customer<input id=xvn value="${esc(v.cust)}"></label><label>Phone<input id=xvp value="${esc(v.ph)}"></label><label>Address<input id=xva value="${esc(v.ad)}"></label><label>Date<input type=date id=xvd value="${v.d}"></label><label>Discount (PKR)<input type=number id=xvx value="${v.dis}"></label><label>Previous Balance<input type=number id=xvold value="${v.old||0}"></label><label>Previous Invoice No<input id=xvoldi value="${esc(v.oldInv||'')}"></label><label>Paid (PKR)<input type=number id=xvq value="${v.pd}"></label><label>Payment type<select id=xvt><option ${v.t=='Cash'?'selected':''}>Cash<option ${v.t=='Online'?'selected':''}>Online</select></label><label>Remarks<input id=xvr value="${esc(v.rm)}"></label></div><h4>Items (quantity 0 removes item)</h4><div class=fg>${v.it.map(x=>`<label>${esc(x.n)} @ ${x.pr}<input type=number class=xvi value="${x.q}"></label>`).join('')}</div><button class=b onclick="saveInv2('${id}')">💾 Save Changes</button><button class=b2 onclick="payInv('${id}')">💵 Record Payment</button><button class="b bd" onclick="delInv('${id}')">🗑 Delete Invoice</button>`)}
function saveInv2(id){const v=D.i.find(x=>x.id==id),qs=[...document.querySelectorAll('.xvi')].map(e=>Math.max(0,+e.value||0));
for(let i=0;i<qs.length;i++){const o=v.it[i],av=qt(o.pid)+o.q;if(qs[i]>av)return alert('Only '+av+' available for '+o.n)}
const it=v.it.map((x,i)=>({...x,q:qs[i]})).filter(x=>x.q>0);
const n=$('#xvn').value.trim();if(!n)return alert('Enter customer name');
const oldPaid=v.pd,sub=it.reduce((a,x)=>a+x.q*x.pr,0),dis=+$('#xvx').value||0,oldBal=Math.max(0,+$('#xvold').value||0),tot=Math.max(0,sub-dis+oldBal),pd=Math.min(Math.max(0,+$('#xvq').value||0),tot);
Object.assign(v,{cust:n,ph:$('#xvp').value.trim(),ad:$('#xva').value.trim(),d:$('#xvd').value||v.d,it,sub,dis,old:oldBal,oldInv:$('#xvoldi').value.trim(),tot,pd,t:$('#xvt').value,rm:$('#xvr').value.trim()});
D.l.filter(x=>x.v==id).forEach(x=>{x.c=n;x.t=v.t});const e=D.l.find(x=>x.v==id),dl=pd-oldPaid;
if(e){e.a+=dl;e.d=v.d;if(e.a<=0)D.l=D.l.filter(x=>x!==e)}else if(dl>0)D.l.push({id:D.n.l++,d:v.d,c:n,x:'Invoice '+id,a:dl,t:v.t,v:id});

   Uses the Firebase project already configured in the supplied working index(1).html.
   The user only needs one shared Sync Code; no Firebase console setup is requested here.

const TAJ_FIREBASE_CONFIG={
  apiKey:"AIzaSyBh5yzMbN8KsjENJzX7kY41tcvL8t9hxUY",
  authDomain:"school-sync-f2377.firebaseapp.com",

};
const TAJ_SYNC=(()=>{
  const CODE_KEY='tajagro_sync_code', TS_KEY='tajagro_sync_ts';
  let code=localStorage.getItem(CODE_KEY)||'', db=null, unsub=null, connected=false;
  let applying=false, timer=null, lastTs=Number(localStorage.getItem(TS_KEY+'_'+(code||'default'))||0);
  const tsKey=()=>TS_KEY+'_'+(code||'default');
  const stamp=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let status='Not connected — data is stored on this device';
  function paint(msg){
    status=msg|| (connected?'☁ Connected — automatic sync is active':'Not connected — data is stored on this device');
    const e=document.getElementById('tajSyncStatus'); if(e)e.textContent=status;
    const h=document.getElementById('syncHeader'); if(h)h.textContent=connected?'☁ Online sync':'☁ Local only';
  }
  function getDb(){
    if(db)return db;
    if(!window.firebase||!firebase.firestore)throw new Error('Firebase could not load. Check your internet connection.');
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(TAJ_FIREBASE_CONFIG);
    db=app.firestore(); return db;
  }
  // Use the same Firestore collection/document path as the supplied working index (1).html.
  // Its existing Firebase security rules permit this path; the previous businessSync path was denied.
  const syncRef=()=>getDb().collection('school').doc('business_'+code);
  function makeCode(){
    const chars='abcdefghjkmnpqrstuvwxyz23456789', bytes=new Uint8Array(20);
    if(!window.crypto||!crypto.getRandomValues)throw new Error('Secure code generation is not available in this browser.');
    crypto.getRandomValues(bytes);let out='';bytes.forEach(n=>out+=chars[n%chars.length]);return out;
  }
  async function pushNow(){
    if(!connected||!db||!code||applying)return;
    if(!navigator.onLine){paint('📴 Offline — changes stay saved here and will sync when internet returns');return;}
    const ts=Math.max(Date.now(),lastTs+1);
    try{
      const payload={data:JSON.stringify(D),updatedAt:ts};
      await syncRef().set(payload,{merge:true});
      lastTs=ts;localStorage.setItem(tsKey(),String(ts));
      paint('✅ Synced successfully at '+stamp());
    }catch(e){paint('⚠ Sync error: '+(e.code||e.message||e));}
  }
  function schedule(){if(!connected||applying)return;clearTimeout(timer);timer=setTimeout(pushNow,650);}
  async function applyRemote(data,ts){
    try{
      const next=typeof data==='string'?JSON.parse(data):data;
      if(!next||typeof next!=='object')throw new Error('Invalid cloud data');
      applying=true; D=next;
      localStorage.setItem(LS,JSON.stringify(D));
      lastTs=Number(ts)||Date.now();localStorage.setItem(tsKey(),String(lastTs));
      applying=false;
      paint('✅ Latest shared data received at '+stamp());

      if(!/INPUT|SELECT|TEXTAREA/.test(active)){try{go(cur)}catch(e){}}
    }catch(e){applying=false;paint('⚠ Could not download cloud data: '+(e.message||e));}
  }
  function listen(){
    if(unsub){unsub();unsub=null;}
    paint('🔄 Connecting to shared business data…');
    unsub=syncRef().onSnapshot(snap=>{
      if(!connected)return;
      if(!snap.exists){paint('Uploading this device’s existing data…');pushNow();return;}
      const v=snap.data()||{}, remoteTs=Number(v.updatedAt)||0;
      if(remoteTs>lastTs){applyRemote(v.data,remoteTs);}
      else if(remoteTs<lastTs){schedule();}
      else paint('✅ Connected — all devices are up to date');
    },e=>paint('⚠ Connection error: '+(e.code||e.message||e)));
  }
  function connect(value){
    const c=String(value||'').trim().replace(/[^A-Za-z0-9_-]/g,'');

  }
  function disconnect(){
    if(unsub){unsub();unsub=null;}connected=false;clearTimeout(timer);code='';
    try{localStorage.removeItem(CODE_KEY);}catch(e){}
    paint('Disconnected — this device is using local data only');
  }
  function push(){if(connected&&!applying)schedule();}
  window.addEventListener('online',()=>{if(connected){paint('Internet restored — syncing…');schedule();}});
  window.addEventListener('offline',()=>{if(connected)paint('📴 Offline — changes are saved on this device');});
  return {connect,generate:makeCode,disconnect,push,text:()=>status,code:()=>code};
})();
