$('#xl').innerHTML=o||'<div class=cd>No results</div>'};

<div class=cd><h3>💵 Other Payment (Non-Stock Income)</h3><p><small>Record money received for services, advances, miscellaneous receipts or any other reason. This is added to Income only; it does not change stock or create an invoice.</small></p><div class=fg><label>Date<input type=date id=xopd value="${td()}"></label><label>Customer Name<input id=xopn list=cl></label><label>Phone (optional)<input type=tel id=xoph></label><label>Address (optional)<input id=xopa></label><label>Payment Details<input id=xopx placeholder="Reason / description of payment"></label><label>Amount Received (PKR)<input type=number id=xopm min=0 step=0.01></label><label>Payment Method<select id=xopt><option>Cash<option>Online</select></label><label>Reference (optional)<input id=xopr></label></div><button class=b onclick="addOtherPayment()">➕ Save Other Payment</button></div>
<div class=cd><h3>Filters</h3>${flt('<label>Type<select id=xft onchange="RF()"><option value="">All<option>Cash<option>Online</select></label><label>Search<input id=xfq oninput="RF()"></label>')}<button class=b2 onclick="repSales()">🖨 Print Report</button></div><div id=xl></div>`;
function gs(){const f=$('#xf1').value,t=$('#xf2').value,ty=$('#xft').value,q=$('#xfq').value.toLowerCase();return D.l.filter(x=>(!f||x.d>=f)&&(!t||x.d<=t)&&(!ty||x.t==ty)&&(!q||(x.c+' '+x.x).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id)}

function addSale(){const a=+$('#xsa').value;if(!(a>0))return alert('Enter income amount');D.l.push({id:D.n.l++,d:$('#xsd1').value||td(),c:$('#xsc').value.trim()||'Walk-in',x:$('#xsx').value.trim(),a,t:$('#xst').value});save();go('sales');ntf('Income recorded','','Saved')}
function addOtherPayment(){const n=$('#xopn').value.trim(),ph=$('#xoph').value.trim(),ad=$('#xopa').value.trim(),details=$('#xopx').value.trim(),ref=$('#xopr').value.trim(),a=+$('#xopm').value,d=$('#xopd').value||td(),t=$('#xopt').value;if(!n)return alert('Enter customer name');if(!(a>0))return alert('Enter amount received');if(!details)return alert('Enter payment details');let c=D.c.find(z=>z.n.toLowerCase()===n.toLowerCase());if(c){if(ph)c.ph=ph;if(ad)c.ad=ad}else{c={id:D.n.c++,n,ph,ad};D.c.push(c)}D.l.push({id:D.n.l++,d,c:n,x:'Other Payment: '+details+(ref?' · Ref: '+ref:''),a,t,other:true,ph,ad,ref});save();go('sales');ntf(R(a)+' other payment received from '+n+' and added to income. No stock changed.','','Other payment saved')}

/* STOCK */
P.stock=()=>`<h2>Stock</h2>${low().length?`<div class=cd style="border-color:var(--r)">${lowH()}</div>`:''}
<div class=cd><h3>➕ Add Stock Quantity</h3><div class=fg><label>Date<input type=date id=xsd value="${td()}"></label><label>Invoice No<input id=xsi></label><label>Batch No<input id=xsb></label><label>Product<select id=xsp>${D.p.map(p=>`<option value=${p.id}>${esc(p.n)}`).join('')}</select></label><label>Quantity<input type=number id=xsq></label><label>Photo (jpg, jpeg, png)<input type=file id=xpf accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks<input id=xsr></label></div><button class=b onclick="addStock()">➕ Add Stock</button></div>
<div class=cd><h3>📦 Old Stock (Opening Stock)</h3><p><small>Enter stock already available before using this app. Date, invoice/reference, batch, photo and remarks are optional.</small></p><div class=fg><label>Old Stock Date (optional)<input type=date id=xosd value="${td()}"></label><label>Invoice / Reference (optional)<input id=xosi placeholder="Old Stock"></label><label>Batch No (optional)<input id=xosb></label><label>Product<select id=xosp>${D.p.map(p=>`<option value=${p.id}>${esc(p.n)}</option>`).join('')}</select></label><label>Available Quantity<input type=number id=xosq></label><label>Photo (optional)<input type=file id=xosf accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks (optional)<input id=xosr placeholder="Opening stock"></label></div><button class=b onclick="addOldStock()">💾 Save Old Stock</button></div>

<div class=cd><label>Search stock entries<input id=xfq oninput="RF()"></label></div><div id=xl></div>`;
A.stock=()=>{const q=$('#xfq').value.toLowerCase(),nm=id=>(D.p.find(p=>p.id==id)||{}).n||'?';$('#xl').innerHTML=`<div class=cd><h3>Current Stock</h3><div class=ov><table><tr><th>Product</th><th>In Stock</th></tr>${D.p.map(p=>`<tr><td>${esc(p.n)}</td><td class="${qt(p.id)<10?'low':''}">${qt(p.id)}</td></tr>`).join('')}</table></div></div><div class=cd><h3>Stock Entries</h3><div class=ov><table><tr><th>Date</th><th>Inv No</th><th>Batch</th><th>Product</th><th>Qty</th><th>Photo</th><th>Remarks</th><th></th></tr>${D.s.filter(x=>!q||(nm(x.p)+x.inv+x.b).toLowerCase().includes(q)).reverse().map(x=>`<tr><td>${fd(x.d)}</td><td>${esc(x.inv)}</td><td>${esc(x.b)}</td><td>${esc(nm(x.p))}</td><td>${x.q}</td><td>${x.ph?`<img src="${x.ph}" width=30>`:''}</td><td>${esc(x.rm)}</td><td><button class=b2 onclick="editS(${x.id})">✏️ Edit</button><button class="b bd" onclick="delS(${x.id})">🗑 Delete</button></td></tr>`).join('')}</table></div></div>`};
function delS(id){const x=D.s.find(z=>z.id==id);if(!x)return;if(x.u)return alert('This stock entry is linked to a purchase. Delete or edit it from the Purchase page.');if(!confirm('Delete this stock entry? Its quantity will be removed from current stock.'))return;D.s=D.s.filter(z=>z.id!=id);save();go('stock');ntf('Stock entry deleted','','Stock updated')}
function editS(id){const x=D.s.find(z=>z.id==id);modal(`<h3>Edit Stock Entry</h3><div class=fg><label>Date<input type=date id=xed value="${x.d}"></label><label>Invoice No<input id=xei value="${esc(x.inv)}"></label><label>Batch No<input id=xeb value="${esc(x.b)}"></label><label>Product<select id=xes>${D.p.map(p=>`<option value=${p.id} ${p.id==x.p?'selected':''}>${esc(p.n)}`).join('')}</select></label><label>Quantity<input type=number id=xeq value="${x.q}"></label><label>New photo (optional)<input type=file id=xef accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks<input id=xer value="${esc(x.rm)}"></label></div><button class=b onclick="saveS(${id})">💾 Save</button>`)}
function saveS(id){const q=+$('#xeq').value;if(!(q>0))return alert('Enter quantity');pic($('#xef'),f=>{const x=D.s.find(z=>z.id==id);Object.assign(x,{d:$('#xed').value||x.d,inv:$('#xei').value,b:$('#xeb').value,p:+$('#xes').value,q,rm:$('#xer').value});if(f)x.ph=f;save();cm();go('stock')})}
function addStock(){const q=+$('#xsq').value;if(!(q>0))return alert('Enter quantity');if(!D.p.length)return alert('Add a product first');pic($('#xpf'),f=>{D.s.push({id:D.n.s++,d:$('#xsd').value||td(),inv:$('#xsi').value,b:$('#xsb').value,p:+$('#xsp').value,q,rm:$('#xsr').value,ph:f});save();go('stock')})}
function addOldStock(){const q=+$('#xosq').value,p=+$('#xosp').value;if(!(q>0))return alert('Enter old stock quantity');if(!p)return alert('Select a product');pic($('#xosf'),f=>{D.s.push({id:D.n.s++,d:$('#xosd').value||td(),inv:$('#xosi').value.trim()||'Old Stock',b:$('#xosb').value.trim(),p,q,rm:$('#xosr').value.trim()||'Opening stock',ph:f,old:true});save();go('stock');ntf('Old stock added','','Opening stock saved')},1)}
const stk=r=>`<div class=ov><table><tr><th>Product</th><th>Price</th><th>In Stock</th><th>Value</th><th>Status</th></tr>${r.map(p=>`<tr><td>${esc(p.n)}</td><td>${p.pr}</td><td>${qt(p.id)}</td><td>${qt(p.id)*p.pr}</td><td>${qt(p.id)<=0?'OUT':qt(p.id)<10?'LOW':'OK'}</td></tr>`).join('')||'<tr><td colspan=5>None</td></tr>'}<tr><th colspan=2>Total</th><th>${r.reduce((a,p)=>a+qt(p.id),0)}</th><th>${R(r.reduce((a,p)=>a+qt(p.id)*p.pr,0))}</th><th></th></tr></table></div>`;

/* INVOICE */
P.inv=()=>`<h2>Invoice</h2><div class=cd><button class=b onclick="itab(1)">🧾 New Invoice</button><button class=b2 onclick="itab(2)">📑 Invoice Records (Edit)</button></div><div id=xnew><div class=cd><div class=fg><label>Customer Name<input id=xn list=cl oninput="fill()"></label><label>Phone No<input id=xp type=tel></label><label>Address (optional)<input id=xa></label></div><label style="flex-direction:row;align-items:center;gap:8px"><input type=checkbox id=xk style="width:auto"> Add this customer to customer list</label></div>
<div class=cd><h3>Select Products</h3><input id=xps placeholder="🔍 Search product..." oninput="pl()" style="margin-bottom:8px"><div class=pg id=xpg></div></div>
<div class=cd><div class=fg><label>Remarks (optional)<input id=xr></label><label>Discount (fixed PKR)<input type=number id=xd value=0 oninput="calc()"></label><label>Pichla Hisab / Previous Balance (optional)<input type=number id=xold value=0 min=0 oninput="calc()"></label><label>Paid now (blank = full payment)<input type=number id=xpd oninput="calc()"></label></div><div class=fg style="grid-template-columns:1fr 1fr"><label style="flex-direction:row;gap:6px;align-items:center"><input type=radio name=pt value=Cash checked style="width:auto"> Cash</label><label style="flex-direction:row;gap:6px;align-items:center"><input type=radio name=pt value=Online style="width:auto"> Online</label></div><div id=xtt class=tt></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class=b onclick="saveInv()">💾 Save Invoice</button><button class=b2 onclick="saveInv(1)">🖨 Save &amp; Print</button></div></div></div><div id=xrec style="display:none">${RB()}</div>`;
function fill(){const c=D.c.find(c=>c.n.toLowerCase()==$('#xn').value.trim().toLowerCase());if(c){$('#xp').value=c.ph;$('#xa').value=c.ad||'';$('#xk').checked=false}}
function cq(id,d){const m=qt(id);let q=(C[id]||0)+d;if(q<0)q=0;if(q>m){q=m;alert('Only '+m+' in stock')}C[id]=q;$('#xq'+id).textContent=q;calc()}

function pl(){const q=$('#xps').value.toLowerCase();$('#xpg').innerHTML=D.p.filter(p=>p.n.toLowerCase().includes(q)).map(p=>`<div class=pc><div class=ph>${p.ph?`<img src="${p.ph}">`:'🌿'}</div><b>${esc(p.n)}</b><br><small>${R(p.pr)} · Stock ${qt(p.id)}</small><div class=qs><button onclick="cq(${p.id},-1)">−</button><span id=xq${p.id}>${C[p.id]||0}</span><button onclick="cq(${p.id},1)">+</button></div></div>`).join('')||'No products'}
A.inv=()=>{pl();calc();A.invs()};
function saveInv(pr){const n=$('#xn').value.trim();if(!n)return alert('Enter customer name');const its=D.p.filter(p=>C[p.id]>0).map(p=>({pid:p.id,n:p.n,pr:p.pr,q:C[p.id]}));if(!its.length)return alert('Select products');const k=calc(),id='INV-'+pad(D.n.i++,4),pn=$('#xp').value.trim(),ad=$('#xa').value.trim();
let c=D.c.find(c=>c.n.toLowerCase()==n.toLowerCase());if(!c&&$('#xk').checked){c={id:'C-'+pad(D.n.c++),n,ph:pn,ad};D.c.push(c)}
const ty=document.querySelector('[name=pt]:checked').value,v={id,d:td(),cust:n,ph:pn||(c&&c.ph)||'',ad,it:its,sub:k.s,dis:k.d,old:k.old||0,tot:k.t,pd:k.pd,t:ty,rm:$('#xr').value.trim()};
D.i.push(v);if(k.pd>0)D.l.push({id:D.n.l++,d:v.d,c:n,x:'Invoice '+id,a:k.pd,t:ty,v:id});C={};save();go('inv');showInv(id);ntf('Invoice '+id+' saved for '+n+' - '+R(k.t),'','Invoice saved');chk();if(pr)setTimeout(prn,400)}
const UN=pid=>((D.p.find(p=>p.id==pid)||{}).u)||'Pcs',N0=x=>Math.round(x).toLocaleString('en-US');
const LEAF=`<svg class=ivl viewBox="0 0 200 110"><path d="M200 0V70Q150 70 120 30Q150 0 200 0Z" fill="#4a1fa8"/><path d="M200 0Q150 10 110 50Q150 60 200 30Z" fill="#9a82e6"/><path d="M200 20Q165 40 150 90Q190 80 200 60Z" fill="#3a1a94"/><path d="M130 0Q100 10 90 30Q120 28 130 0Z" fill="#ffb300"/></svg>`;
const WAVE=`<svg class=ivw viewBox="0 0 600 140" preserveAspectRatio="none"><path d="M0 50Q160 10 340 70T600 100V140H0Z" fill="#3a1a94"/><path d="M0 64Q170 30 340 86T600 112" fill="none" stroke="#ffb300" stroke-width="5"/><path d="M0 76Q180 48 340 100T600 126V140H0Z" fill="#9a82e6"/></svg>`;
const payG=v=>{const l=D.l.filter(x=>x.v==v.id).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);return l.length?`<div class=ivp><b>Payments Received</b>${l.map(x=>`<div><span>${fd(x.d)}</span><span>${x.t}</span><span>${R(x.a)}</span></div>`).join('')}</div>`:''};
const invDoc=v=>{const rem=v.tot-v.pd;return HD('Sale Invoice')+`<div class=ivinf><div><b>Invoice No:</b> ${esc(v.id)}</div><div><b>Date:</b> ${fd(v.d)}</div><div><b>Customer:</b> ${esc(v.cust)}</div>${v.ph?`<div><b>Phone:</b> ${esc(v.ph)}</div>`:''}<div style="grid-column:1/-1"><b>Address:</b> ${esc(v.ad||'—')}</div></div><table><tr><th>Sr.</th><th>Description</th><th>Qty</th><th>Unit</th><th>Rate (Rs.)</th><th>Amount (Rs.)</th></tr>${v.it.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td class=nr>${x.q}</td><td>${esc(UN(x.pid))}</td><td class=nr>${N0(x.pr)}</td><td class=nr>${N0(x.q*x.pr)}</td></tr>`).join('')}</table><div class=ivx2><div><span>Sub Total:</span><span>${N0(v.sub)}</span></div><div><span>Discount:</span><span>${N0(v.dis)}</span></div>${v.old?`<div><span>Pichla Hisab:</span><span>${N0(v.old)}</span></div>`:''}<div class=tot><span>Total:</span><span>${N0(v.tot)}</span></div><div><span>Paid:</span><span>${N0(v.pd)}</span></div><div class="${rem>0?'rd':''}"><span>Remaining:</span><span>${N0(rem)}</span></div></div>${payG(v)}${v.rm?`<div class=ivtc><b>Remarks:</b> ${esc(v.rm)}</div>`:''}${SG()}`};
const msg=v=>D.set.sms.replace(/\{(\w+)\}/g,(a,k)=>({name:v.cust,inv:v.id,total:v.tot,paid:v.pd,due:v.tot-v.pd,date:fd(v.d),type:v.t})[k]??a);
const payTb=v=>{const l=D.l.filter(x=>x.v==v.id).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);return l.length?`<h4 style="margin:6px 0 2px">Payments Received</h4><table><tr><th>Date</th><th>Type</th><th>Amount</th></tr>${l.map(x=>`<tr><td>${fd(x.d)}</td><td>${x.t}</td><td>${R(x.a)}</td></tr>`).join('')}</table>`:''};
function showInv(id,z){const v=D.i.find(x=>x.id==id),m=encodeURIComponent(msg(v)),sz=z||'A4';modal(invDoc(v),sz,`<button class=b2 onclick="showInv('${id}','A6')">A6</button><button class=b2 onclick="showInv('${id}','A4')">A4</button>${v.tot>v.pd?`<button class=b2 onclick="payInv('${id}')">💵 Payment</button>`:''}<button class="b bd" onclick="delInv('${id}')">🗑 Delete</button><a class=b2 target="_blank" href="https://wa.me/${ph(v.ph)}?text=${m}">WhatsApp</a><a class=b2 href="sms:${esc(v.ph)}?body=${m}">SMS</a>`)}
function payInv(id){const v=D.i.find(x=>x.id==id),r=v.tot-v.pd;if(r<=0)return alert('Invoice is fully paid');modal(`<h3>💵 Record Payment ${id}</h3><div><b>${esc(v.cust)}</b></div><div>Total ${R(v.tot)} · Paid ${R(v.pd)} · Remaining ${R(r)}</div><div class=fg><label>Date<input type=date id=xpdt value="${td()}"></label><label>Amount (PKR)<input type=number id=xpam value="${r}" oninput="pcalc('${id}')"></label><label>Type<select id=xpty><option>Cash<option>Online</select></label></div><div class=tt id=xpc></div><button class=b onclick="savePay('${id}')">💾 Save &amp; Show Receipt</button>`);pcalc(id)}
function pcalc(id){const v=D.i.find(x=>x.id==id),a=Math.min(+$('#xpam').value||0,v.tot-v.pd);$('#xpc').innerHTML=`Paying now: ${R(a)}<br>Remaining after: ${R(v.tot-v.pd-a)}`}
function savePay(id){const v=D.i.find(x=>x.id==id),a=+$('#xpam').value;if(!(a>0))return alert('Enter amount');if(a>v.tot-v.pd)return alert('Amount is more than remaining');const t=$('#xpty').value;v.pd+=a;D.l.push({id:D.n.l++,d:$('#xpdt').value||td(),c:v.cust,x:'Payment for '+id,a,t,v:id});save();bell0();go('inv');itab(2);showInv(id);ntf(R(a)+' received from '+v.cust+'. Remaining '+R(v.tot-v.pd),'','Payment recorded')}

/* INVOICE RECORDS */
const RB=()=>`<div class=cd>${flt('<label>Search<input id=xfq oninput="RF()"></label><label>Status<select id=xft onchange="RF()"><option value="">All<option value=d>Remaining due<option value=p>Fully paid</select></label>')}<button class=b2 onclick="repInv()">🖨 Print Report</button></div><div id=xl></div>`;
P.invs=()=>'<h2>Invoice Records</h2>'+RB();
function gi(){const f=$('#xf1').value,t=$('#xf2').value,s=$('#xft').value,q=$('#xfq').value.toLowerCase();return D.i.filter(v=>(!f||v.d>=f)&&(!t||v.d<=t)&&(!q||(v.cust+v.id).toLowerCase().includes(q))&&(!s||(s=='d')==(v.tot>v.pd))).reverse()}
const itb=(r,act)=>`<div class=ov><table><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th>${act?'<th></th>':''}</tr>${r.map(v=>`<tr><td>${v.id}</td><td>${fd(v.d)}</td><td><b>${esc(v.cust)}</b></td><td>${R(v.tot)}</td><td>${R(v.pd)}</td><td>${R(v.tot-v.pd)}</td>${act?`<td><button class=b2 onclick="showInv('${v.id}')">🧾</button>${v.tot>v.pd?`<button class=b2 onclick="payInv('${v.id}')">💵</button>`:''}<button class=b onclick="editInv('${v.id}')">✏️ Edit</button><button class="b bd" onclick="delInv('${v.id}')">🗑 Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan=7>No records</td></tr>'}<tr><th colspan=3>Total</th><th>${R(r.reduce((a,v)=>a+v.tot,0))}</th><th>${R(r.reduce((a,v)=>a+v.pd,0))}</th><th>${R(r.reduce((a,v)=>a+v.tot-v.pd,0))}</th>${act?'<th></th>':''}</tr></table></div>`;
A.invs=()=>$('#xl').innerHTML=`<div class=cd>${itb(gi(),1)}</div>`;
function repInv(){modal(HD('Invoice Records')+itb(gi())+SG(),'A4')}
function delInv(id){const v=D.i.find(x=>x.id==id);if(!v)return;if(!confirm('Delete invoice '+id+' for '+v.cust+'? Its linked payment records will also be deleted.'))return;D.i=D.i.filter(x=>x.id!=id);D.l=D.l.filter(x=>x.v!=id);save();cm();go(cur==='inv'?'inv':cur);if(cur==='inv')itab(2);ntf('Invoice '+id+' deleted','','Invoice deleted')}

/* CUSTOMERS */
P.cust=()=>`<h2>Customers</h2><div class=cd><h3>Add Customer (ID: C-${pad(D.n.c)})</h3><div class=fg><label>Name<input id=xcn></label><label>Phone No<input id=xcp type=tel></label><label>Address (optional)<input id=xca></label></div><button class=b onclick="addCust()">➕ Add Customer</button></div><div class=cd><div class=fg><label>Search<input id=xfq oninput="RF()"></label><label>Filter<select id=xft onchange="RF()"><option value="">All<option value=d>With dues</select></label></div></div><div id=xl></div>`;
A.cust=()=>{const q=$('#xfq').value.toLowerCase(),f=$('#xft').value;$('#xl').innerHTML=`<div class="cd ov"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Address</th><th>Due</th><th></th></tr>${D.c.map((c,i)=>[c,i]).filter(([c])=>(!q||(c.n+c.ph+c.id).toLowerCase().includes(q))&&(!f||due(c.n)>0)).map(([c,i])=>`<tr><td>${c.id}</td><td>${esc(c.n)}</td><td>${esc(c.ph)}</td><td>${esc(c.ad)}</td><td class="${due(c.n)>0?'low':''}">${R(due(c.n))}</td><td><button class=b onclick="recv(${i})">💵</button><button class=b2 onclick="ledger(${i})">📒</button>${due(c.n)>0?sendB(c.n,c.ph,due(c.n)):''}<button class="b bd" onclick="delCust(${i})">🗑</button></td></tr>`).join('')||'<tr><td colspan=6>No customers</td></tr>'}</table></div>`};
function addCust(){const n=$('#xcn').value.trim();if(!n)return alert('Enter name');D.c.push({id:'C-'+pad(D.n.c++),n,ph:$('#xcp').value.trim(),ad:$('#xca').value.trim()});save();go('cust')}
function delCust(i){if(confirm('Delete customer?')){D.c.splice(i,1);save();go('cust')}}
function recv(i){const c=D.c[i],d=due(c.n);if(d<=0)return alert('No dues');let a=+prompt('Due '+R(d)+'. Amount received (PKR)?',d);if(!(a>0))return;a=Math.min(a,d);const ty=confirm('OK = Cash, Cancel = Online')?'Cash':'Online';let r=a;D.i.filter(v=>v.cust.toLowerCase()==c.n.toLowerCase()&&v.tot>v.pd).forEach(v=>{const x=Math.min(r,v.tot-v.pd);if(x>0){v.pd+=x;r-=x;D.l.push({id:D.n.l++,d:td(),c:c.n,x:'Payment received '+v.id,a:x,t:ty,v:v.id})}});save();go('cust');ntf(R(a)+' received from '+c.n,'','Payment received')}
const itl=r=>`<div class=ov><table><tr><th>Invoice</th><th>Date</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${r.map(v=>v.it.map(x=>`<tr><td>${v.id}</td><td>${fd(v.d)}</td><td>${esc(x.n)}</td><td>${x.q}</td><td>${x.pr}</td><td>${x.q*x.pr}</td></tr>`).join('')).join('')||'<tr><td colspan=6>No records</td></tr>'}<tr><th colspan=3>Total</th><th>${r.reduce((a,v)=>a+v.it.reduce((b,x)=>b+x.q,0),0)}</th><th></th><th>${r.reduce((a,v)=>a+v.it.reduce((b,x)=>b+x.q*x.pr,0),0)}</th></tr></table></div>`;
function ledger(i){const c=D.c[i],iv=D.i.filter(v=>v.cust.toLowerCase()==c.n.toLowerCase()),py=D.l.filter(x=>x.c.toLowerCase()==c.n.toLowerCase());modal(HD('Customer Payment Record')+`<div><b>${c.id} · ${esc(c.n)} · ${esc(c.ph)}${c.ad?' · '+esc(c.ad):''}</b></div><p style="text-align:right"><b>Total Due: ${R(due(c.n))}</b></p><h4>Products Purchased</h4>${itl(iv)}<h4>Invoices</h4>${itb(iv)}<h4>Payments</h4>${tbl(py)}`+SG(),'A4')}

/* PRODUCTS */
P.prod=()=>`<h2>Product List</h2><div class=cd><h3>Add Product</h3><div class=fg><label>Product Name<input id=xpn></label><label>Price (PKR)<input type=number id=xpp></label><label>Unit (Maund, Bag, Pcs…)<input id=xpu placeholder="Pcs"></label><label>Photo (jpg, jpeg, png - 3:4)<input type=file id=xpf accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks (optional)<input id=xpr></label></div><button class=b onclick="addProd()">➕ Add Product</button></div><div class=pg>${D.p.map((p,i)=>`<div class=pc><div class=ph>${p.ph?`<img src="${p.ph}">`:'🌿'}</div><b>${esc(p.n)}</b><br>${R(p.pr)}<br><small>${esc(p.rm||'')} Stock: ${qt(p.id)}</small><br><button class=b2 onclick="editP(${i})">✏️ Edit</button><button class="b bd" onclick="delP(${i})">🗑</button></div>`).join('')}</div>`;
function addProd(){const n=$('#xpn').value.trim(),pr=+$('#xpp').value;if(!n||!(pr>0))return alert('Enter name and price');pic($('#xpf'),f=>{D.p.push({id:D.n.p++,n,pr,u:$('#xpu').value.trim(),ph:f,rm:$('#xpr').value});save();go('prod')})}
function editP(i){const p=D.p[i];modal(`<h3>Edit Product</h3><div class=fg><label>Name<input id=xen value="${esc(p.n)}"></label><label>Price (PKR)<input type=number id=xep value="${p.pr}"></label><label>Unit<input id=xeu value="${esc(p.u||'')}" placeholder="Pcs"></label><label>New photo (optional)<input type=file id=xef accept=".jpg,.jpeg,.png,image/jpeg,image/png"></label><label>Remarks<input id=xer value="${esc(p.rm||'')}"></label></div><button class=b onclick="saveP(${i})">💾 Save</button>`)}
function saveP(i){const n=$('#xen').value.trim(),pr=+$('#xep').value;if(!n||!(pr>0))return alert('Enter name and price');pic($('#xef'),f=>{const p=D.p[i];p.n=n;p.pr=pr;p.u=$('#xeu').value.trim();p.rm=$('#xer').value;if(f)p.ph=f;save();cm();go('prod')})}
function delP(i){if(confirm('Delete product?')){D.p.splice(i,1);save();go('prod')}}

/* FINANCIAL */
function itab(n){$('#xnew').style.display=n==1?'block':'none';$('#xrec').style.display=n==2?'block':'none';if(n==2)A.invs()}
function editInv(id){const v=D.i.find(x=>x.id==id);modal(`<h3>Edit ${v.id}</h3><div class=fg><label>Customer<input id=xvn value="${esc(v.cust)}"></label><label>Phone<input id=xvp value="${esc(v.ph)}"></label><label>Address<input id=xva value="${esc(v.ad)}"></label><label>Date<input type=date id=xvd value="${v.d}"></label><label>Discount (PKR)<input type=number id=xvx value="${v.dis}"></label><label>Pichla Hisab / Previous Balance (PKR)<input type=number id=xvold min=0 value="${v.old||0}"></label><label>Paid (PKR)<input type=number id=xvq value="${v.pd}"></label><label>Payment type<select id=xvt><option ${v.t=='Cash'?'selected':''}>Cash<option ${v.t=='Online'?'selected':''}>Online</select></label><label>Remarks<input id=xvr value="${esc(v.rm)}"></label></div><h4>Items (quantity 0 removes item)</h4><div class=fg>${v.it.map(x=>`<label>${esc(x.n)} @ ${x.pr}<input type=number class=xvi value="${x.q}"></label>`).join('')}</div><button class=b onclick="saveInv2('${id}')">💾 Save Changes</button><button class=b2 onclick="payInv('${id}')">💵 Record Payment</button><button class="b bd" onclick="delInv('${id}')">🗑 Delete Invoice</button>`)}
function saveInv2(id){const v=D.i.find(x=>x.id==id),qs=[...document.querySelectorAll('.xvi')].map(e=>Math.max(0,+e.value||0));
for(let i=0;i<qs.length;i++){const o=v.it[i],av=qt(o.pid)+o.q;if(qs[i]>av)return alert('Only '+av+' available for '+o.n)}
const it=v.it.map((x,i)=>({...x,q:qs[i]})).filter(x=>x.q>0);if(!it.length)return alert('Invoice needs at least one item');
const n=$('#xvn').value.trim();if(!n)return alert('Enter customer name');
const oldPaid=v.pd,sub=it.reduce((a,x)=>a+x.q*x.pr,0),dis=+$('#xvx').value||0,oldBal=Math.max(0,+$('#xvold').value||0),tot=Math.max(0,sub-dis)+oldBal,pd=Math.min(Math.max(0,+$('#xvq').value||0),tot);
Object.assign(v,{cust:n,ph:$('#xvp').value.trim(),ad:$('#xva').value.trim(),d:$('#xvd').value||v.d,it,sub,dis,old:oldBal,tot,pd,t:$('#xvt').value,rm:$('#xvr').value.trim()});
D.l.filter(x=>x.v==id).forEach(x=>{x.c=n;x.t=v.t});const e=D.l.find(x=>x.v==id),dl=pd-oldPaid;
if(e){e.a+=dl;e.d=v.d;if(e.a<=0)D.l=D.l.filter(x=>x!==e)}else if(dl>0)D.l.push({id:D.n.l++,d:v.d,c:n,x:'Invoice '+id,a:dl,t:v.t,v:id});
save();cm();bell0();go('inv');itab(2)}

/* EXPENSES */
function xform(k){const sf=k=='self';return `<h2>${sf?'🙋 Self Expense':'💸 Expenses'}</h2><div class=cd><h3>Add ${sf?'Self Expense':'Expense'} (deducted from income)</h3>${sf?`<div class=fg><label>Self expense type<select id=xxm onchange="xm()"><option>Cash<option>Product</select></label></div>`:''}<div class=fg><label>Date<input type=date id=xxd value="${td()}"></label><label><span id=xal>Amount (PKR)</span><input type=number id=xxa></label><label>${sf?'Details (optional)':'Expense details'}<input id=xxx></label>${sf?`<label class=xp>Product (own agriculture)<select id=xxp onchange="xpa()"><option value=0>— Select —${D.p.map(p=>`<option value=${p.id}>${esc(p.n)}`).join('')}</select></label><label class=xp>Quantity<input type=number id=xxq oninput="xpa()"></label>`:''}<label>Paid from<select id=xxt><option>Cash<option>Online</select></label></div><button class=b onclick="addX('${k}')">➕ Add</button></div><div class=cd>${flt('<label>Search<input id=xfq oninput="RF()"></label>')}<button class=b2 onclick="repX('${k}')">🖨 Print Report</button></div><div id=xl></div>`}
function xm(){const m=$('#xxm');if(!m)return;const c=m.value=='Cash';document.querySelectorAll('.xp').forEach(e=>e.style.display=c?'none':'flex');$('#xal').textContent=c?'Cash payment amount (PKR)':'Amount (PKR), blank = price × qty'}
function xpa(){const p=D.p.find(z=>z.id==$('#xxp').value),q=+$('#xxq').value;$('#xxa').placeholder=p&&q?'Auto: '+(p.pr*q):''}
function xrec(id){const e=D.x.find(z=>z.id==id),pr=e.p?D.p.find(z=>z.id==e.p):0,sf=e.k=='self',m=e.m||(e.p?'Product':'Cash');modal(HD(sf?'SELF EXPENSE RECEIPT':'EXPENSE RECEIPT')+`<div>Receipt No: ${sf?'SE':'EX'}-${pad(e.id,4)} &nbsp; Date: ${fd(e.d)}</div>${sf?`<div>Type: ${m=='Product'?'Product (own use)':'Cash payment'}</div>`:''}${e.x?`<div>Details: ${esc(e.x)}</div>`:''}${pr?`<table><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th></tr><tr><td>${esc(pr.n)}</td><td>${e.q}</td><td>${pr.pr}</td><td>${e.q*pr.pr}</td></tr></table>`:''}<hr><div style="text-align:right"><div>Paid from: ${e.t}</div><div>Amount recorded: ${R(e.a)}</div></div>`+SG(),'A6')}
P.exp=()=>xform('shop');P.self=()=>xform('self');
function gx(k){const f=$('#xf1').value,t=$('#xf2').value,q=$('#xfq').value.toLowerCase();return D.x.filter(e=>e.k==k&&(!f||e.d>=f)&&(!t||e.d<=t)&&(!q||(e.x+' '+(e.p?pnm(e.p):'')).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id)}
const xtb=(r,act)=>`<div class=ov><table><tr><th>Date</th><th>Details</th><th>Product</th><th>Qty</th><th>Type</th><th>Amount</th>${act?'<th></th>':''}</tr>${r.map(e=>`<tr><td>${fd(e.d)}</td><td>${esc(e.x)}</td><td>${e.p?esc(pnm(e.p)):''}</td><td>${e.q||''}</td><td>${e.t}</td><td>${R(e.a)}</td>${act?`<td><button class=b2 onclick="xrec(${e.id})">🧾</button><button class="b bd" onclick="delX(${e.id})">🗑</button></td>`:''}</tr>`).join('')||'<tr><td colspan=6>No records</td></tr>'}<tr><th colspan=5>Total</th><th>${R(sm(r))}</th>${act?'<th></th>':''}</tr></table></div>`;
const xsec=(k,r,act)=>k=='self'?`<p style="text-align:right"><b>Grand Total: ${R(sm(r))}</b></p><h4>🌾 Own agriculture (products used)</h4>${xtb(r.filter(e=>e.p),act)}<h4>Other self expense</h4>${xtb(r.filter(e=>!e.p),act)}`:xtb(r,act);
A.exp=A.self=()=>{const k=cur=='self'?'self':'shop';if(k=='self')xm();$('#xl').innerHTML=`<div class=cd>${xsec(k,gx(k),1)}</div>`};
function addX(k){let a=+$('#xxa').value,p=0,q=0,m='Cash';if(k=='self'){m=$('#xxm').value;if(m=='Product'){p=+$('#xxp').value;q=+$('#xxq').value||0;if(!p||!(q>0))return alert('Select product and quantity');if(!a)a=q*D.p.find(z=>z.id==p).pr;if(q>qt(p))return alert('Only '+qt(p)+' in stock')}}if(!(a>0))return alert('Enter amount');D.x.push({id:D.n.x++,d:$('#xxd').value||td(),a,x:$('#xxx').value.trim(),p,q,k,t:$('#xxt').value,m});save();go(cur);ntf(R(a)+' '+(k=='self'?'self expense':'expense')+' recorded','','Saved');chk()}
function delX(id){const z=D.x.find(e=>e.id==id);if(z&&z.u)return alert('This expense comes from a purchase. Delete it from the Purchase page.');if(confirm('Delete record?')){D.x=D.x.filter(e=>e.id!=id);save();A[cur]()}}
function repX(k){modal(HD(k=='self'?'Self Expense Report':'Expense Report')+xsec(k,gx(k))+SG(),'A4')}

/* REPORTS */
const sendB=(n,p,d)=>{const m=encodeURIComponent(D.set.rem.replace(/\{(\w+)\}/g,(a,k)=>({name:n,due:R(d),address:D.set.addr})[k]??a));return `<a class=b2 target="_blank" href="https://wa.me/${ph(p)}?text=${m}">💬 WhatsApp</a><a class=b2 href="sms:${esc(p)}?body=${m}">✉️ SMS</a>`};
const dueRows=iv=>{const m={};iv.filter(v=>v.tot>v.pd).forEach(v=>{const k=v.cust.toLowerCase(),o=m[k]=m[k]||{n:v.cust,ph:'',i:[],p:[],d:0};o.i.push(v.id);o.p.push(...v.it.map(x=>esc(x.n)+' x'+x.q));o.d+=v.tot-v.pd;o.ph=o.ph||v.ph});return Object.values(m)};
const dueT=iv=>{const r=dueRows(iv);return `<div class=ov><table><tr><th>Customer</th><th>Phone</th><th>Invoices</th><th>Products</th><th>Remaining</th><th class=np></th></tr>${r.map(o=>`<tr><td><b>${esc(o.n)}</b></td><td><b>${esc(o.ph)}</b></td><td>${o.i.join(', ')}</td><td>${o.p.join(', ')}</td><td>${R(o.d)}</td><td class=np>${sendB(o.n,o.ph,o.d)}</td></tr>`).join('')||'<tr><td colspan=6>None</td></tr>'}<tr><th colspan=4>Total to be returned</th><th>${R(r.reduce((s,o)=>s+o.d,0))}</th><th class=np></th></tr></table></div>`};
const RT=[['a','All'],['s','Sales'],['e','Expense'],['se','Self expense'],['sc','Stock - Current'],['so','Stock - Out of stock'],['sl','Stock - Low (under 10)'],['p','Products'],['d','Payments to be returned'],['cu','Customers'],['iv','Invoices & products sold'],['pu','Purchases'],['su','Suppliers: purchases, paid & payable'],['sy','Payments made to suppliers']];
let FH='';
P.fin=()=>`<h2>📊 Reports</h2><div class=cd><div class=fg><label>Report<select id=xrt onchange="RF()">${RT.map(o=>`<option value=${o[0]}>${o[1]}`).join('')}</select></label><label>Period<select id=xpm onchange="RF()"><option value=c>Selected dates<option value=t>Today<option value=m>Month<option value=y>Year<option value=a>All time</select></label><label>Month<input type=month id=xmo value="${td().slice(0,7)}" oninput="RF()"></label><label>Year<input type=number id=xyr value="${td().slice(0,4)}" oninput="RF()"></label><label>From (selected dates)<input type=date id=xf1 oninput="RF()"></label><label>To (selected dates)<input type=date id=xf2 oninput="RF()"></label><label>Payment type<select id=xft onchange="RF()"><option value="">All<option>Cash<option>Online</select></label><label>Supplier (supplier reports)<select id=xfs onchange="RF()"><option value="">All${SP().map(x=>`<option value=${x.id}>${esc(x.n)}`).join('')}</select></label></div><button class=b2 onclick="modal(FH,'A4')">🖨 Print / PDF</button></div><div id=xl></div>`;
A.fin=()=>{const pm=$('#xpm').value,ty=$('#xft').value,rt=$('#xrt').value;let f=$('#xf1').value,t=$('#xf2').value,lab='Selected dates';
if(pm=='t'){f=t=td();lab='Today'}else if(pm=='m'){const m=$('#xmo').value;f=m+'-01';t=m+'-31';lab='Month '+m.split('-').reverse().join('-')}else if(pm=='y'){const y=$('#xyr').value;f=y+'-01-01';t=y+'-12-31';lab='Year '+y}else if(pm=='a'){f=t='';lab='All time'}
const ok=x=>(!f||x.d>=f)&&(!t||x.d<=t)&&(!ty||x.t==ty),r=D.l.filter(ok),iv=D.i.filter(ok),ex=D.x.filter(e=>e.k=='shop'&&ok(e)),se=D.x.filter(e=>e.k=='self'&&ok(e)),w=k=>rt=='a'?['s','e','se','sc','iv','d'].includes(k):rt==k,H=(n,b)=>`<h4>${n}</h4>${b}`;
let h=`<div>${RT.find(o=>o[0]==rt)[1]} · ${lab}${pm=='c'?': '+(f?fd(f):'Start')+' to '+(t?fd(t):fd(td())):''}${ty?' · '+ty:''}</div>`;
if(rt=='a')h+=`<table><tr><td>Total Sales (Income)</td><td>${R(sm(r))}</td></tr><tr><td>Cash Payment</td><td>${R(sm(r.filter(x=>x.t=='Cash')))}</td></tr><tr><td>Online Payment</td><td>${R(sm(r.filter(x=>x.t=='Online')))}</td></tr><tr><td>Shop Expense</td><td>${R(sm(ex))}</td></tr><tr><td>Self Expense</td><td>${R(sm(se))}</td></tr><tr><td>Total Purchases</td><td>${R(PU().filter(ok).reduce((a,u)=>a+u.a,0))}</td></tr><tr><td>Paid to Suppliers</td><td>${R(PU().filter(ok).reduce((a,u)=>a+ppd(u),0))}</td></tr><tr><td>Payable to Suppliers</td><td>${R(PU().filter(ok).reduce((a,u)=>a+pdue(u),0))}</td></tr><tr><th>Net Balance</th><th>${R(sm(r)-sm(ex)-sm(se))}</th></tr><tr><td>Invoices</td><td>${iv.length} (${R(iv.reduce((a,v)=>a+v.tot,0))})</td></tr></table>`;
if(w('s'))h+=H('Sales',tbl(r));if(w('e'))h+=H('Expenses',xtb(ex));if(w('se'))h+=H('Self Expense',xsec('self',se));
if(w('sc'))h+=H('Current Stock',stk(D.p));if(rt=='so')h+=H('Out of Stock',stk(D.p.filter(p=>qt(p.id)<=0)));if(rt=='sl')h+=H('Low Stock (under 10)',stk(D.p.filter(p=>qt(p.id)<10)));if(rt=='p')h+=H('Products',stk(D.p));
if(w('iv'))h+=H('Invoices',itb(iv))+(rt=='iv'?H('Products Sold',itl(iv)):'');

/* URDU FONT FILE */
let FNAME='';
const FDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('tajfont',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const fput=o=>FDB().then(db=>new Promise((ok,no)=>{const t=db.transaction('f','readwrite');o?t.objectStore('f').put(o,'urdu'):t.objectStore('f').delete('urdu');t.oncomplete=ok;t.onerror=()=>no(t.error)}));
const fget=()=>FDB().then(db=>new Promise((ok,no)=>{const q=db.transaction('f').objectStore('f').get('urdu');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));

/* ===== TAJ M AGRO TRADERS: AUTOMATIC FIREBASE SYNC =====
   Uses the Firebase project already configured in the supplied working index(1).html.
   The user only needs one shared Sync Code; no Firebase console setup is requested here.
*/
const TAJ_FIREBASE_CONFIG={
  apiKey:"AIzaSyBh5yzMbN8KsjENJzX7kY41tcvL8t9hxUY",
  authDomain:"school-sync-f2377.firebaseapp.com",
  projectId:"school-sync-f2377",
  appId:"1:1065175050512:web:27cce416f6bbb7b832dd95"
};
const TAJ_SYNC=(()=>{
  const CODE_KEY='tajagro_sync_code', TS_KEY='tajagro_sync_ts';
  let code=localStorage.getItem(CODE_KEY)||'', db=null, unsub=null, connected=false;
  let applying=false, timer=null, lastTs=Number(localStorage.getItem(TS_KEY+'_'+(code||'default'))||0);
  const tsKey=()=>TS_KEY+'_'+(code||'default');
  const stamp=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let status='Not connected — data is stored on this device';
  function paint(msg){
    status=msg|| (connected?'☁ Connected — automatic sync is active':'Not connected — data is stored on this device');
    const e=document.getElementById('tajSyncStatus'); if(e)e.textContent=status;
    const h=document.getElementById('syncHeader'); if(h)h.textContent=connected?'☁ Online sync':'☁ Local only';
  }
  function getDb(){
    if(db)return db;
    if(!window.firebase||!firebase.firestore)throw new Error('Firebase could not load. Check your internet connection.');
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(TAJ_FIREBASE_CONFIG);
    db=app.firestore(); return db;
  }
  // Use the same Firestore collection/document path as the supplied working index (1).html.
  // Its existing Firebase security rules permit this path; the previous businessSync path was denied.
  const syncRef=()=>getDb().collection('school').doc('business_'+code);
  function makeCode(){
    const chars='abcdefghjkmnpqrstuvwxyz23456789', bytes=new Uint8Array(20);
    if(!window.crypto||!crypto.getRandomValues)throw new Error('Secure code generation is not available in this browser.');
    crypto.getRandomValues(bytes);let out='';bytes.forEach(n=>out+=chars[n%chars.length]);return out;
  }
  async function pushNow(){
    if(!connected||!db||!code||applying)return;
    if(!navigator.onLine){paint('📴 Offline — changes stay saved here and will sync when internet returns');return;}
    const ts=Math.max(Date.now(),lastTs+1);
    try{
      const payload={data:JSON.stringify(D),updatedAt:ts};
      await syncRef().set(payload,{merge:true});
      lastTs=ts;localStorage.setItem(tsKey(),String(ts));
      paint('✅ Synced successfully at '+stamp());
    }catch(e){paint('⚠ Sync error: '+(e.code||e.message||e));}
  }
  function schedule(){if(!connected||applying)return;clearTimeout(timer);timer=setTimeout(pushNow,650);}
  async function applyRemote(data,ts){
    try{
      const next=typeof data==='string'?JSON.parse(data):data;
      if(!next||typeof next!=='object')throw new Error('Invalid cloud data');
      applying=true; D=next;
      localStorage.setItem(LS,JSON.stringify(D));
      lastTs=Number(ts)||Date.now();localStorage.setItem(tsKey(),String(lastTs));
      applying=false;
      paint('✅ Latest shared data received at '+stamp());
      const active=(document.activeElement||{}).tagName||'';
      if(!/INPUT|SELECT|TEXTAREA/.test(active)){try{go(cur)}catch(e){}}
    }catch(e){applying=false;paint('⚠ Could not download cloud data: '+(e.message||e));}
  }
  function listen(){
    if(unsub){unsub();unsub=null;}
    paint('🔄 Connecting to shared business data…');
    unsub=syncRef().onSnapshot(snap=>{
      if(!connected)return;
      if(!snap.exists){paint('Uploading this device’s existing data…');pushNow();return;}
      const v=snap.data()||{}, remoteTs=Number(v.updatedAt)||0;
      if(remoteTs>lastTs){applyRemote(v.data,remoteTs);}
      else if(remoteTs<lastTs){schedule();}
      else paint('✅ Connected — all devices are up to date');
    },e=>paint('⚠ Connection error: '+(e.code||e.message||e)));
  }
  function connect(value){
    const c=String(value||'').trim().replace(/[^A-Za-z0-9_-]/g,'');
    if(c.length<8){alert('Enter a valid Sync Code, or tap Generate Code first.');return;}
    code=c;
    try{localStorage.setItem(CODE_KEY,code);lastTs=Number(localStorage.getItem(tsKey())||0);}
    catch(e){}
    try{
      getDb();connected=true;
      const inp=document.getElementById('tajSyncCode');if(inp)inp.value=code;
      listen();
    }catch(e){connected=false;paint('⚠ '+(e.message||e));alert(e.message||e);}
  }
  function disconnect(){
    if(unsub){unsub();unsub=null;}connected=false;clearTimeout(timer);code='';
    try{localStorage.removeItem(CODE_KEY);}catch(e){}
    paint('Disconnected — this device is using local data only');
  }
  function push(){if(connected&&!applying)schedule();}
  window.addEventListener('online',()=>{if(connected){paint('Internet restored — syncing…');schedule();}});
  window.addEventListener('offline',()=>{if(connected)paint('📴 Offline — changes are saved on this device');});
  return {connect,generate:makeCode,disconnect,push,text:()=>status,code:()=>code};
})();
